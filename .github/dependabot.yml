# Dependency and base-image updates feed the PR vulnerability gate
# (docs/CICD_STRATEGY.md section 3.2). A PR that fixes a vulnerability covered
# by security/vulnerability-exceptions.toml must also delete that exception;
# the gate fails with "stale" or "fix now available" until it does.
#
# Dependabot PRs run CI with Dependabot secrets, so SNYK_TOKEN,
# DOCKER_ORG_USERNAME and DOCKER_ORG_ACCESS_TOKEN must also be configured as
# Dependabot secrets or the vulnerability scan fails closed.
version: 2

registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKER_ORG_USERNAME}}
    password: ${{secrets.DOCKER_ORG_ACCESS_TOKEN}}

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # Digest bumps for the DHI runtime base also require updating
    # EXPECTED_RUNTIME_BASE in scripts/validate_docker_base.py.
    directory: /
    registries: [dhi]
    schedule:
      interval: daily

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
