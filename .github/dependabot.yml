# Dependency and base-image updates feed the trusted post-CI vulnerability
# assessment (docs/IMAGE_SECURITY_APPROVALS.md). A PR that fixes a
# vulnerability covered by security/vulnerability-exceptions.toml must also
# delete that exception; the gate fails with "stale" or "fix now available"
# until it does.
#
# Dependabot PR CI only receives Dependabot secrets, so the read-only
# DOCKER_ORG_USERNAME and DOCKER_ORG_ACCESS_TOKEN must be configured there for
# private DHI pulls. The trusted assessment uses repository Actions secrets.
version: 2

registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKER_ORG_USERNAME}}
    password: ${{secrets.DOCKER_ORG_ACCESS_TOKEN}}

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # Builder and runtime digests are refreshed together. New digests within
    # the fixed Python 3.14 / Debian 13 DHI family need no allowlist update;
    # the trusted assessment verifies provenance and scans the candidate.
    directory: /
    registries: [dhi]
    schedule:
      interval: daily
    ignore:
      - dependency-name: dhi.io/python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      dhi-python-base-images:
        patterns: ["dhi.io/python"]

  # Dependabot reads this file only from the default branch, so the active
  # release branch is targeted explicitly. Update target-branch when a new
  # release/* branch is cut and remove this entry once it is merged to main.
  - package-ecosystem: docker
    directory: /
    target-branch: release/2.0.0
    registries: [dhi]
    schedule:
      interval: daily
    ignore:
      - dependency-name: dhi.io/python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      dhi-python-base-images:
        patterns: ["dhi.io/python"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
