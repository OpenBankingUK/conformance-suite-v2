version: 2
updates:
  # Weekly digest-update PRs for the Docker Hardened Image base images pinned
  # in the Dockerfile. Each PR runs the full check suite, the hardened
  # runtime smoke test, and the vulnerability scan (candidate-image CI)
  # before merge — the same gate as any other candidate.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"

  # Weekly updates for the project's own Python dependencies.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  # Weekly updates for the GitHub Actions used in CI/CD workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
