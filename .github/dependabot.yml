# Dependency and base-image updates use normal CI and the external Snyk/CodeQL
# PR checks (docs/IMAGE_SECURITY_APPROVALS.md).
#
# Dependabot PR CI only receives Dependabot secrets, so the read-only
# DOCKER_ORG_USERNAME and DOCKER_ORG_ACCESS_TOKEN must be configured there for
# private DHI pulls. Publishing credentials must remain environment-scoped.
version: 2

registries:
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{secrets.DOCKER_ORG_USERNAME}}
    password: ${{secrets.DOCKER_ORG_ACCESS_TOKEN}}

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # Builder and runtime digests are refreshed together. New digests within
    # the selected DHI Python 3.14 image family need no allowlist update;
    # CI validates the image contract and smoke-tests both platforms.
    directory: /
    registries: [dhi]
    schedule:
      interval: daily
    # Docker dependency names omit the registry host: dhi.io/python is python.
    # Ignore tag major/minor jumps, not digest refreshes within the current tag.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      dhi-python-base-images:
        patterns: ["python"]

  # Dependabot reads this file only from the default branch, so the active
  # release branch is targeted explicitly. Update target-branch when a new
  # release/* branch is cut and remove this entry once it is merged to main.
  - package-ecosystem: docker
    directory: /
    target-branch: release/2.0.0
    registries: [dhi]
    schedule:
      interval: daily
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      dhi-python-base-images:
        patterns: ["python"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
