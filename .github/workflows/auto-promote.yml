name: Auto-promote image

on:
  workflow_run:
    workflows: ["Trusted security assessment"]
    types: [completed]

permissions:
  contents: read

# Share the manual callers' lock through publication AND release finalization.
# Never cancel a running publication, including while awaiting approval.
concurrency:
  group: image-promotion
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve candidate promotion
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-latest
    # Only cancel redundant *resolution* attempts for the same branch: once a
    # run has decided should_promote=true and handed off to `promote`, a GA
    # image publish can already be underway/complete, so the workflow must
    # not be cancellable past this point or a published image could be left
    # without its Git tag, GitHub Release, or (GA) merge-back PR (see
    # _finalize-release for the idempotent recovery this relies on).
    concurrency:
      group: auto-promote-resolve-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    outputs:
      should_promote: ${{ steps.resolve.outputs.should_promote }}
      channel: ${{ steps.resolve.outputs.channel }}
      environment_name: ${{ steps.resolve.outputs.environment_name }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_sha: ${{ steps.receipt.outputs.source_sha }}
      source_branch: ${{ steps.receipt.outputs.source_branch }}
      ci_run_id: ${{ steps.receipt.outputs.ci_run_id }}
    permissions:
      contents: read
      actions: read
    env:
      ASSESSMENT_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Verify the triggering workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_ASSESSMENT_WORKFLOW_PATH: ".github/workflows/security-assessment.yml"
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ASSESSMENT_RUN_ID")"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/security-assessment.yml" --jq '.id')"
          if ! jq -e \
            --arg path "$TRUSTED_ASSESSMENT_WORKFLOW_PATH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflow_id "$workflow_id" \
            '.workflow_id == $workflow_id
             and .name == "Trusted security assessment"
             and .path == $path
             and .head_repository.full_name == $repository
             and .conclusion == "success"
             and .run_attempt == 1' \
            <<<"$run_json" >/dev/null; then
            echo "::error::Workflow run $ASSESSMENT_RUN_ID is not a successful first-attempt trusted security assessment." >&2
            exit 1
          fi

      - name: Download candidate-bound assessment receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: security-assessment-receipt
          path: ${{ runner.temp }}/security-assessment

      - name: Validate assessment receipt and source CI run
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ASSESSMENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/security-assessment/assessment-receipt.json"
          jq -e '.schema_version == 1 and (.decision == "pass" or .decision == "approved")' "$receipt" >/dev/null
          ci_run_id="$(jq -r '.source_run_id' "$receipt")"
          source_sha="$(jq -r '.source_sha' "$receipt")"
          jq -e --arg sha "$source_sha" '.checked_sha == $sha' "$receipt" >/dev/null
          if ! [[ "$ci_run_id" =~ ^[0-9]+$ && "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Assessment receipt has invalid source run or commit identity." >&2
            exit 1
          fi
          ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id")"
          jq -e \
            --arg sha "$source_sha" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflow_id 268848247 \
            '.workflow_id == $workflow_id
             and .path == ".github/workflows/ci.yml"
             and .head_sha == $sha
             and .event == "push"
             and .conclusion == "success"
             and .run_attempt == 1
             and .head_repository.full_name == $repository' \
            <<<"$ci_run" >/dev/null || {
              echo "::error::Assessment receipt does not identify a successful first-attempt candidate push from the trusted CI workflow." >&2
              exit 1
            }
          branch="$(jq -r '.head_branch' <<<"$ci_run")"
          {
            echo "ci_run_id=$ci_run_id"
            echo "source_sha=$source_sha"
            echo "source_branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Check for the CI promotion manifest
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.receipt.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "promotion-manifest" and .expired == false) | .id' \
            > promotion-manifest-artifact-ids.txt
          if [[ ! -s promotion-manifest-artifact-ids.txt ]]; then
            echo "::notice::CI run $CI_RUN_ID did not produce a promotion-manifest artifact; no promotion is needed."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read candidate pyproject.toml without executing candidate code
        if: steps.artifact.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ steps.receipt.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:pyproject.toml" > candidate-pyproject.toml

      - name: Set up uv
        if: steps.artifact.outputs.available == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install trusted release-tooling dependencies
        if: steps.artifact.outputs.available == 'true'
        run: uv sync --frozen --no-install-project

      - name: List published Docker Hub version tags
        if: steps.artifact.outputs.available == 'true'
        run: |
          set -euo pipefail
          uv run python -m scripts.list_docker_hub_tags > published-versions.txt

      - name: Resolve promotion policy
        id: resolve
        if: steps.artifact.outputs.available == 'true'
        env:
          SOURCE_SHA: ${{ steps.receipt.outputs.source_sha }}
          SOURCE_BRANCH: ${{ steps.receipt.outputs.source_branch }}
        run: |
          set -euo pipefail
          args=(
            --pyproject candidate-pyproject.toml
            --branch "$SOURCE_BRANCH"
            --source-sha "$SOURCE_SHA"
            --manifest-available
            --published-versions-file published-versions.txt
          )
          decision="$(uv run python -m scripts.resolve_auto_promotion "${args[@]}")"
          tag="$(jq -r '.tag // empty' <<<"$decision")"

          if [[ -n "$tag" ]]; then
            tag_refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
            tag_target_sha="$(
              awk -v ref="refs/tags/$tag" \
                '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 }
                 END { if (peeled != "") print peeled; else if (direct != "") print direct }' \
                <<<"$tag_refs"
            )"
            if [[ -n "$tag_target_sha" ]]; then
              decision="$(
                uv run python -m scripts.resolve_auto_promotion \
                  "${args[@]}" --tag-target-sha "$tag_target_sha"
              )"
            fi
          fi

          should_promote="$(jq -r '.should_promote' <<<"$decision")"
          channel="$(jq -r '.channel // empty' <<<"$decision")"
          environment_name="$(jq -r '.environment_name // empty' <<<"$decision")"
          tag="$(jq -r '.tag // empty' <<<"$decision")"
          notice="$(jq -r '.notice // empty' <<<"$decision")"
          if [[ -n "$notice" ]]; then
            notice="${notice//%/%25}"
            notice="${notice//$'\r'/%0D}"
            notice="${notice//$'\n'/%0A}"
            printf '::notice::%s\n' "$notice"
          fi
          {
            echo "should_promote=$should_promote"
            echo "channel=$channel"
            echo "environment_name=$environment_name"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote (${{ needs.resolve.outputs.channel }})
    needs: resolve
    if: needs.resolve.outputs.should_promote == 'true'
    uses: ./.github/workflows/_promote-image.yml
    with:
      channel: ${{ needs.resolve.outputs.channel }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      branch: ${{ needs.resolve.outputs.source_branch }}
      tag: ${{ needs.resolve.outputs.tag }}
      environment_name: ${{ needs.resolve.outputs.environment_name }}
      ci_run_id: ${{ needs.resolve.outputs.ci_run_id }}
      security_assessment_run_id: ${{ github.event.workflow_run.id }}
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
      pull-requests: read
    secrets:
      DOCKER_ORG_USERNAME: ${{ secrets.DOCKER_ORG_USERNAME }}
      DOCKER_ORG_ACCESS_TOKEN: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  finalize:
    name: Tag and create GitHub Release
    needs: [resolve, promote]
    if: >-
      needs.resolve.outputs.should_promote == 'true' &&
      (needs.resolve.outputs.channel == 'ga' || needs.resolve.outputs.channel == 'beta')
    uses: ./.github/workflows/_finalize-release.yml
    with:
      channel: ${{ needs.resolve.outputs.channel }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      raw_version: ${{ needs.promote.outputs.raw_version }}
      published_digest: ${{ needs.promote.outputs.published_digest }}
      beta_latest_updated: ${{ needs.promote.outputs.beta_latest_updated }}
    permissions:
      contents: write
      pull-requests: write
