name: Finalize GA release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
        description: "Exact main commit successfully published as a GA image."
      tag:
        required: true
        type: string
        description: "Exact vX.Y.Z Git tag for the GA release."

permissions:
  contents: read

jobs:
  finalize:
    name: Create release tag and merge-back PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Create the GA tag at the promoted source commit
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character Git SHA." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::GA Git tag must use the vX.Y.Z format." >&2
            exit 1
          fi
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"

          tag_refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_target_sha="$(
            awk -v ref="refs/tags/$RELEASE_TAG" \
              '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 }
               END { if (peeled != "") print peeled; else if (direct != "") print direct }' \
              <<<"$tag_refs"
          )"
          if [[ -n "$tag_target_sha" ]]; then
            if [[ "$tag_target_sha" != "$SOURCE_SHA" ]]; then
              echo "::error::Git tag $RELEASE_TAG already points to $tag_target_sha, not $SOURCE_SHA." >&2
              exit 1
            fi
            echo "Git tag $RELEASE_TAG already points to the promoted source commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$SOURCE_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Open a pull request merging main back into develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main develop
          if git diff --quiet origin/develop origin/main --; then
            echo "develop is already up to date with main; nothing to open."
            exit 0
          fi
          existing="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Merge-back PR #$existing already open."
            exit 0
          fi
          gh pr create \
            --base develop \
            --head main \
            --title "Merge GA release $RELEASE_TAG back into develop" \
            --body "Automated merge-back after promoting $RELEASE_TAG to GA. Review and merge to keep develop current with the released state of main."
