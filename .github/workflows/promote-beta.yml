name: Promote beta image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: "Exact commit SHA on main to promote."

permissions:
  contents: read

# Hold the shared caller lock through publication and finalization.
concurrency:
  group: image-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    uses: ./.github/workflows/_promote-image.yml
    with:
      channel: beta
      source_sha: ${{ inputs.source_sha }}
      branch: main
      environment_name: beta-release
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
      pull-requests: read
    secrets:
      DOCKER_ORG_USERNAME: ${{ secrets.DOCKER_ORG_USERNAME }}
      DOCKER_ORG_ACCESS_TOKEN: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

  finalize:
    name: Tag and create GitHub prerelease
    needs: promote
    uses: ./.github/workflows/_finalize-release.yml
    with:
      channel: beta
      source_sha: ${{ inputs.source_sha }}
      raw_version: ${{ needs.promote.outputs.raw_version }}
      published_digest: ${{ needs.promote.outputs.published_digest }}
      beta_latest_updated: ${{ needs.promote.outputs.beta_latest_updated }}
    permissions:
      contents: write
      pull-requests: write
