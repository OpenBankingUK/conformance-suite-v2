name: Promote beta image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: "Exact commit SHA on a release/X.Y.Z branch to promote."
      branch:
        required: true
        description: "The exact release/X.Y.Z branch the commit is on."

permissions:
  contents: read

# Hold the shared caller lock through approval, publication, and finalization.
concurrency:
  group: image-promotion
  cancel-in-progress: false

jobs:
  validate-branch:
    name: Validate branch pattern
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-release branches
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          case "$INPUT_BRANCH" in
            release/*) exit 0 ;;
            *)
              echo "::error::Beta promotion requires a 'release/X.Y.Z' branch, got '$INPUT_BRANCH'." >&2
              exit 1
              ;;
          esac

  promote:
    name: Promote
    needs: validate-branch
    uses: ./.github/workflows/_promote-image.yml
    with:
      channel: beta
      source_sha: ${{ inputs.source_sha }}
      branch: ${{ inputs.branch }}
      environment_name: beta-release
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
      pull-requests: read
    secrets:
      DOCKER_ORG_USERNAME: ${{ secrets.DOCKER_ORG_USERNAME }}
      DOCKER_ORG_ACCESS_TOKEN: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  finalize:
    name: Tag and create GitHub prerelease
    needs: promote
    uses: ./.github/workflows/_finalize-release.yml
    with:
      channel: beta
      source_sha: ${{ inputs.source_sha }}
      raw_version: ${{ needs.promote.outputs.raw_version }}
      published_digest: ${{ needs.promote.outputs.published_digest }}
      beta_latest_updated: ${{ needs.promote.outputs.beta_latest_updated }}
    permissions:
      contents: write
      pull-requests: write
