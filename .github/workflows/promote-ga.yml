name: Promote GA image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        description: "Exact commit SHA on main to promote (the finalized release/X.Y.Z merge)."
      tag:
        required: true
        description: "The exact vX.Y.Z Git tag identifying the release commit on main."

permissions:
  contents: read

# Hold the shared caller lock through approval, publication, and finalization.
concurrency:
  group: image-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote
    uses: ./.github/workflows/_promote-image.yml
    with:
      channel: ga
      source_sha: ${{ inputs.source_sha }}
      branch: main
      tag: ${{ inputs.tag }}
      environment_name: ga-release
    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
      pull-requests: read
    secrets:
      DOCKER_ORG_USERNAME: ${{ secrets.DOCKER_ORG_USERNAME }}
      DOCKER_ORG_ACCESS_TOKEN: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  finalize:
    name: Tag, create GitHub Release, and open develop merge-back
    needs: promote
    uses: ./.github/workflows/_finalize-release.yml
    with:
      channel: ga
      source_sha: ${{ inputs.source_sha }}
      raw_version: ${{ needs.promote.outputs.raw_version }}
      published_digest: ${{ needs.promote.outputs.published_digest }}
    permissions:
      contents: write
      pull-requests: write
