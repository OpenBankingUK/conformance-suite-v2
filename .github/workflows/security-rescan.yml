name: Security re-scan

# Daily re-scan of what we ship and what we are about to ship, against
# current vulnerability data. New CVEs are disclosed after merge/publish, so
# PR-time scanning alone is not enough. Results are tracked as one GitHub
# issue per vulnerability (and per exception problem), updated every run and
# closed automatically once a complete run no longer reports it.
#
# Everything that executes comes from the default branch: the scan action,
# the gate and the issue sync. Other branches are only built with Docker and
# read for their Dockerfile, uv.lock and exceptions file.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-rescan
  cancel-in-progress: false

jobs:
  targets:
    name: Select scan targets
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.select.outputs.branches }}
      tags: ${{ steps.select.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: List branches and published tags
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branches="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' \
              | jq -R -s -c --arg default "$DEFAULT_BRANCH" \
                'split("\n") | map(select(. != "" and (. == $default or startswith("release/")))) | unique'
          )"
          uv run python -m scripts.rescan_published_images select \
            --branches "$branches" --output rescan-targets.json
          tags="$(jq -c '.images' rescan-targets.json)"
          echo "Branches: $branches"
          echo "Published digests: $tags"
          {
            echo "## Published-image rescan scope"
            echo
            echo "Newest beta, rc and GA versions plus unknown tags; aliases share one digest scan per platform."
            jq -r '.images[] | "- Scanning `" + (.tags | join("`, `")) + "` at `" + .digest + "`"' rescan-targets.json
            echo
            echo "### Superseded tags (skipped, not deleted)"
            jq -r 'if .superseded == [] then "None." else .superseded[] | "- `" + . + "`" end' rescan-targets.json
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "branches=$branches"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Save selected scope for issue closure checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rescan-targets
          path: rescan-targets.json
          if-no-files-found: error

  scan-branch:
    name: Branch ${{ matrix.branch }}
    needs: targets
    if: needs.targets.outputs.branches != '[]'
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.targets.outputs.branches) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout branch under scan
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          path: target
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Inspect branch
        id: inspect
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          # Candidate DHI families admit daily digest refreshes without a
          # source-controlled digest allowlist. Historical approved references
          # remain readable for old branches and published images.
          if base_ref="$(uv run python -m scripts.validate_docker_base \
            --candidate-dhi --stdin --print-runtime-base < target/Dockerfile 2>/dev/null)"; then
            hardened=true
            base_policy=candidate-dhi
          elif base_ref="$(uv run python -m scripts.validate_docker_base \
            --stdin --print-runtime-base < target/Dockerfile 2>/dev/null)"; then
            hardened=true
            base_policy=historical-approved
            echo "::notice::$BRANCH uses a historical approved DHI base; candidate-family admission does not apply."
          else
            hardened=false
            base_policy=unrecognised
            base_ref=""
          fi
          exceptions="security/vulnerability-exceptions.toml"
          test -f "$exceptions"
          slug="$(tr -c 'A-Za-z0-9._-' '-' <<<"$BRANCH" | sed 's/-*$//')"
          {
            echo "hardened=$hardened"
            echo "base_policy=$base_policy"
            echo "runtime_base=$base_ref"
            echo "exceptions=$exceptions"
            echo "slug=$slug"
            echo "sha=$(git -C target rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to dhi.io
        if: steps.inspect.outputs.hardened == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Build branch image (linux/amd64)
        env:
          SHA: ${{ steps.inspect.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --build-arg CONFORMANCE_TOOL_VERSION="0.0.0+scan.$SHA" \
            --build-arg SOURCE_REVISION="$SHA" \
            --tag "ob-conformance-scan:$SHA" \
            --load \
            target

      - name: Log out of dhi.io
        if: always() && steps.inspect.outputs.hardened == 'true'
        run: docker logout dhi.io

      - name: Scan branch image
        uses: ./.github/actions/vulnerability-scan
        with:
          image: ob-conformance-scan:${{ steps.inspect.outputs.sha }}
          image-source: local
          platform: linux/amd64
          target: "branch ${{ matrix.branch }} (linux/amd64)"
          vex-image: ${{ steps.inspect.outputs.runtime_base }}
          vex-requires-dhi-login: "true"
          lock-directory: target
          dockerfile: target/Dockerfile
          gate-directory: .
          exceptions-file: ${{ steps.inspect.outputs.exceptions }}
          report-name: vulnerability-report-branch-${{ steps.inspect.outputs.slug }}
          fail-on-findings: "false"
          sarif-category: scheduled-branch-${{ steps.inspect.outputs.slug }}
          sarif-ref: refs/heads/${{ matrix.branch }}
          sarif-sha: ${{ steps.inspect.outputs.sha }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          docker-username: ${{ secrets.DOCKER_ORG_USERNAME }}
          docker-password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

  scan-image:
    name: Published ${{ matrix.image.tag }} (${{ matrix.platform }})
    needs: targets
    if: needs.targets.outputs.tags != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.targets.outputs.tags) }}
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Resolve approved published runtime base
        id: base
        env:
          VERSION: ${{ matrix.image.version }}
        run: |
          set -euo pipefail
          base_ref="$(uv run python -m scripts.rescan_published_images base --version "$VERSION")"
          echo "runtime_base=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Name report
        id: name
        env:
          TAG: ${{ matrix.image.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          slug="$(tr -c 'A-Za-z0-9._-' '-' <<<"$TAG-$PLATFORM" | sed 's/-*$//')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Scan published image
        # Derived images do not inherit DHI VEX attestations. Read the matching
        # release tag as data, and apply only main's approved exact runtime base.
        uses: ./.github/actions/vulnerability-scan
        with:
          image: docker.io/openbanking/conformance-suite-v2@${{ matrix.image.digest }}
          image-source: registry
          platform: ${{ matrix.platform }}
          target: "published openbanking/conformance-suite-v2:${{ join(matrix.image.tags, ', ') }} (${{ matrix.platform }})"
          vex-image: ${{ steps.base.outputs.runtime_base }}
          vex-requires-dhi-login: "true"
          gate-directory: .
          exceptions-file: security/vulnerability-exceptions.toml
          report-name: vulnerability-report-image-${{ steps.name.outputs.slug }}
          fail-on-findings: "false"
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          docker-username: ${{ secrets.DOCKER_ORG_USERNAME }}
          docker-password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

  issues:
    name: Sync vulnerability issues
    needs: [targets, scan-branch, scan-image]
    if: always() && needs.targets.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vulnerability-report-*
          path: ${{ runner.temp }}/reports

      - name: Download selected scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rescan-targets
          path: ${{ runner.temp }}/scope

      - name: Create, update and close issues
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_RESULT: ${{ needs.scan-branch.result }}
          IMAGE_RESULT: ${{ needs.scan-image.result }}
        run: |
          set -euo pipefail
          mapfile -t reports < <(find "$RUNNER_TEMP/reports" -name report.json -type f | sort)
          args=()
          # Issues are only closed when every target produced a report;
          # otherwise a failed scan could look like a fixed vulnerability.
          if [[ "$BRANCH_RESULT" =~ ^(success|skipped)$ && "$IMAGE_RESULT" =~ ^(success|skipped)$ ]]; then
            args+=(--complete)
          else
            echo "::warning::Not every scan completed (branches: $BRANCH_RESULT, images: $IMAGE_RESULT); open issues will not be auto-closed this run."
          fi
          if (( ${#reports[@]} == 0 )); then
            echo "::error::No vulnerability reports were produced." >&2
            exit 1
          fi
          uv run --no-project --python 3.14 -- python -m scripts.vulnerability_issues \
            --scope "$RUNNER_TEMP/scope/rescan-targets.json" "${args[@]}" "${reports[@]}"

      - name: Fail when a scan could not run
        if: needs.scan-branch.result == 'failure' || needs.scan-image.result == 'failure'
        run: |
          echo "::error::At least one scheduled scan failed to run. Check the scan jobs; scanner or credential errors fail closed." >&2
          exit 1
