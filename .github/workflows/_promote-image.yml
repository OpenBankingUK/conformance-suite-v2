name: Promote candidate image

# Reusable workflow shared by promote-preview.yml, promote-beta.yml, and
# promote-ga.yml. Never runs branch-supplied code: it checks out the trusted
# ref that owns this workflow file (the branch a human dispatched it from,
# always main), and only reads a single file (pyproject.toml) out of the
# candidate commit via `git show`, never executing anything from it. It
# republishes the exact platform images a successful candidate-image CI run
# already built, scanned, and smoke-tested; it never rebuilds.

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
        description: "preview, beta, or ga."
      source_sha:
        required: true
        type: string
        description: "Exact commit SHA the successful candidate-image run was built from."
      branch:
        required: true
        type: string
        description: "Exact source branch the candidate was built from."
      tag:
        required: false
        type: string
        default: ""
        description: "Git tag on the release commit. Required for GA."
      environment_name:
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/openbankinguk/conformance-suite-v2
  PACKAGE_OWNER: openbankinguk
  PACKAGE_NAME: conformance-suite-v2

jobs:
  promote:
    name: Promote (${{ inputs.channel }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        # Checks out the trusted ref this workflow file lives on (main), not
        # the candidate source SHA.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Locate the successful candidate-image run for this source SHA
        id: locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(
            gh run list --repo "${{ github.repository }}" --workflow ci.yml --json databaseId,headSha,conclusion,event -L 100 \
              | jq -r --arg sha "${{ inputs.source_sha }}" \
                'map(select(.headSha == $sha and .conclusion == "success")) | sort_by(.databaseId) | last | .databaseId // empty'
          )"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful CI run found for commit ${{ inputs.source_sha }}." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download candidate artifacts from that run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.locate.outputs.run_id }}
          path: artifacts
          pattern: "candidate-linux-*"
          merge-multiple: false

      - name: Download the promotion manifest from that run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.locate.outputs.run_id }}
          name: promotion-manifest
          path: artifacts/manifest

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd artifacts
          amd64_tar="candidate-linux-amd64/image-linux-amd64.tar"
          arm64_tar="candidate-linux-arm64/image-linux-arm64.tar"
          sha256sum "$amd64_tar" "$arm64_tar" > actual.sha256
          # The recorded checksums file used the CI job's own relative paths;
          # compare content, not path spelling.
          diff <(awk '{print $1}' actual.sha256 | sort) <(awk '{print $1}' manifest/checksums.sha256 | sort)

      - name: Confirm the candidate commit's own pyproject.toml matches the manifest
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ inputs.source_sha }}"
          committed_version="$(git show "${{ inputs.source_sha }}:pyproject.toml" | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')"
          manifest_version="$(jq -r '.raw_version' artifacts/manifest/promotion-manifest.json)"
          if [[ "$committed_version" != "$manifest_version" ]]; then
            echo "::error::pyproject.toml at ${{ inputs.source_sha }} has version $committed_version, manifest claims $manifest_version." >&2
            exit 1
          fi

      - name: Confirm the source commit belongs to a reviewed, approved pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/${{ github.repository }}/commits/${{ inputs.source_sha }}/pulls" --jq 'map(select(.merged_at != null)) | first | .number // empty')"
          if [[ -z "$pr_number" ]]; then
            echo "::error::No merged pull request found for commit ${{ inputs.source_sha }}." >&2
            exit 1
          fi
          approved="$(gh api "repos/${{ github.repository }}/pulls/$pr_number/reviews" --jq 'map(select(.state == "APPROVED")) | length')"
          if [[ "$approved" -lt 1 ]]; then
            echo "::error::Pull request #$pr_number for commit ${{ inputs.source_sha }} has no recorded approval." >&2
            exit 1
          fi

      - name: List already-published version tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions" --paginate \
            --jq '.[].metadata.container.tags[]?' > published-versions.txt || touch published-versions.txt

      - name: Revalidate the candidate manifest
        id: validate
        run: |
          set -euo pipefail
          args=(
            --manifest artifacts/manifest/promotion-manifest.json
            --source-sha "${{ inputs.source_sha }}"
            --branch "${{ inputs.branch }}"
            --published-versions-file published-versions.txt
          )
          if [[ -n "${{ inputs.tag }}" ]]; then
            args+=(--tag "${{ inputs.tag }}")
          fi
          result="$(uv run python -m scripts.validate_promotion "${args[@]}")"
          echo "$result"
          {
            echo "raw_version=$(jq -r '.raw_version' <<<"$result")"
            echo "amd64_digest=$(jq -r '.platform_digests["linux/amd64"]' <<<"$result")"
            echo "arm64_digest=$(jq -r '.platform_digests["linux/arm64"]' <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          jq -c '.expected_tags' <<<"$result" > expected-tags.json

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Load and stage each already-scanned platform image
        # Loads the exact bytes candidate-image CI built and scanned, retags
        # them to a temporary per-run staging tag, and pushes only so that
        # digest exists in the registry for imagetools to reference below.
        # This never rebuilds the image.
        run: |
          set -euo pipefail
          staging_suffix="promote-${{ inputs.source_sha }}"

          docker load --input "artifacts/candidate-linux-amd64/image-linux-amd64.tar"
          docker tag "${{ steps.validate.outputs.amd64_digest }}" "${IMAGE_NAME}:${staging_suffix}-amd64"
          docker push "${IMAGE_NAME}:${staging_suffix}-amd64"

          docker load --input "artifacts/candidate-linux-arm64/image-linux-arm64.tar"
          docker tag "${{ steps.validate.outputs.arm64_digest }}" "${IMAGE_NAME}:${staging_suffix}-arm64"
          docker push "${IMAGE_NAME}:${staging_suffix}-arm64"

      - name: Assemble and publish the multi-arch manifest list
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "${IMAGE_NAME}:${tag}")
          done < <(jq -r '.[]' expected-tags.json)

          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE_NAME}@${{ steps.validate.outputs.amd64_digest }}" \
            "${IMAGE_NAME}@${{ steps.validate.outputs.arm64_digest }}"

      - name: Remove the temporary staging tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always()
        run: |
          set -euo pipefail
          staging_suffix="promote-${{ inputs.source_sha }}"
          for platform_tag in "${staging_suffix}-amd64" "${staging_suffix}-arm64"; do
            # shellcheck disable=SC2016 # $tag below is a jq variable, not a shell expansion.
            version_id="$(
              gh api "orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions" --paginate \
                --jq --arg tag "$platform_tag" 'map(select(.metadata.container.tags[]? == $tag)) | first | .id // empty'
            )"
            if [[ -n "$version_id" ]]; then
              gh api -X DELETE "orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}/versions/${version_id}" || true
            fi
          done

      - name: Attest build provenance for the published manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.validate.outputs.amd64_digest }}
          push-to-registry: true

      - name: Attest SBOM for the published manifest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.validate.outputs.amd64_digest }}
          sbom-path: artifacts/candidate-linux-amd64/sbom-linux-amd64.spdx.json
          push-to-registry: true
