name: Promote candidate image

# Reusable workflow shared by the automatic and manual promotion workflows.
# Never runs branch-supplied code: it checks out the trusted
# ref that owns this workflow file (the branch a human dispatched it from,
# always main), and reads candidate files only as data via `git show`,
# never executing anything from the candidate checkout. It
# republishes the exact platform images a successful candidate-image CI run
# already built and smoke-tested; it never rebuilds. Publishing environments
# scope write credentials to trusted main without requiring manual approval.

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
        description: "preview, beta, or ga."
      source_sha:
        required: true
        type: string
        description: "Exact commit SHA the successful candidate-image run was built from."
      branch:
        required: true
        type: string
        description: "Exact source branch the candidate was built from."
      tag:
        required: false
        type: string
        default: ""
        description: "Git tag on the release commit. Required for GA."
      environment_name:
        required: true
        type: string
      ci_run_id:
        required: false
        type: string
        default: ""
        description: "Exact successful CI run to promote; omitted for manual recovery dispatches."
    secrets:
      DOCKER_ORG_USERNAME:
        required: true
      DOCKER_ORG_ACCESS_TOKEN:
        required: true
    outputs:
      raw_version:
        description: "Exact version published to Docker Hub."
        value: ${{ jobs.promote.outputs.raw_version }}
      published_digest:
        description: "Published multi-architecture manifest digest."
        value: ${{ jobs.promote.outputs.published_digest }}
      beta_latest_updated:
        description: "Whether the MVP beta pointer now targets this image."
        value: ${{ jobs.promote.outputs.beta_latest_updated }}

permissions:
  contents: read

# The root callers hold image-promotion through publication and finalization.
# Do not reacquire their concurrency group here: a reusable call would deadlock.

env:
  IMAGE_NAME: docker.io/openbanking/conformance-suite-v2
  INPUT_BRANCH: ${{ inputs.branch }}
  INPUT_CHANNEL: ${{ inputs.channel }}
  INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_TAG: ${{ inputs.tag }}
  INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}

jobs:
  locate:
    name: Locate candidate run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}

    steps:
      - name: Require a trusted main-branch dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Promotion workflows must be dispatched from main, not $GITHUB_REF." >&2
            exit 1
          fi
          if ! [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character Git SHA." >&2
            exit 1
          fi
          git check-ref-format --branch "$INPUT_BRANCH" >/dev/null

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Locate and verify the successful candidate-image run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_CI_WORKFLOW_ID: "268848247"
          TRUSTED_CI_WORKFLOW_PATH: ".github/workflows/ci.yml"
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_CI_RUN_ID" ]]; then
            run_id="$INPUT_CI_RUN_ID"
          else
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --json databaseId,headSha,headBranch,conclusion,event -L 100 \
                | jq -r --arg sha "$INPUT_SOURCE_SHA" --arg branch "$INPUT_BRANCH" \
                  'map(select(.headSha == $sha and .headBranch == $branch and .event == "push" and .conclusion == "success"))
                   | sort_by(.databaseId) | last | .databaseId // empty'
            )"
          fi
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful push CI run found for $INPUT_SOURCE_SHA on $INPUT_BRANCH." >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          if ! jq -e \
            --arg sha "$INPUT_SOURCE_SHA" \
            --arg branch "$INPUT_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg path "$TRUSTED_CI_WORKFLOW_PATH" \
            --argjson workflow_id "$TRUSTED_CI_WORKFLOW_ID" \
            '.name == "CI"
             and .workflow_id == $workflow_id
             and .path == $path
             and .head_sha == $sha
             and .head_branch == $branch
             and .event == "push"
             and .conclusion == "success"
             and .head_repository.full_name == $repository' \
            <<<"$run_json" >/dev/null; then
            echo "::error::CI run $run_id is not the trusted successful push CI run for $INPUT_SOURCE_SHA on $INPUT_BRANCH." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the promotion manifest for publication details
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.locate.outputs.run_id }}
          name: promotion-manifest
          path: ${{ runner.temp }}/publication-manifest

      - name: Summarize the release candidate
        env:
          PUBLICATION_ENVIRONMENT: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          uv run python -m scripts.list_docker_hub_tags > published-versions.txt
          args=(
            --manifest "$RUNNER_TEMP/publication-manifest/promotion-manifest.json"
            --source-sha "$INPUT_SOURCE_SHA"
            --branch "$INPUT_BRANCH"
            --channel "$INPUT_CHANNEL"
            --published-versions-file published-versions.txt
            --summary-file "$GITHUB_STEP_SUMMARY"
            --environment-name "$PUBLICATION_ENVIRONMENT"
          )
          if [[ -n "$INPUT_TAG" ]]; then
            args+=(--tag "$INPUT_TAG")
          fi
          uv run python -m scripts.validate_promotion "${args[@]}"

  promote:
    name: Promote (${{ inputs.channel }})
    needs: locate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    outputs:
      raw_version: ${{ steps.validate.outputs.raw_version }}
      published_digest: ${{ steps.publish.outputs.published_digest }}
      beta_latest_updated: ${{ steps.beta_latest.outputs.updated || 'false' }}

    permissions:
      contents: read
      actions: read
      attestations: write
      artifact-metadata: write
      id-token: write
      pull-requests: read

    steps:
      - name: Require a trusted main-branch dispatch
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Promotion workflows must be dispatched from main, not $GITHUB_REF." >&2
            exit 1
          fi
          if ! [[ "$INPUT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full lowercase 40-character Git SHA." >&2
            exit 1
          fi
          git check-ref-format --branch "$INPUT_BRANCH" >/dev/null

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Locate and verify the successful candidate-image run
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
          # Re-verify the exact candidate run immediately before publication.
          INPUT_CI_RUN_ID: ${{ needs.locate.outputs.run_id }}
          TRUSTED_CI_WORKFLOW_ID: "268848247"
          TRUSTED_CI_WORKFLOW_PATH: ".github/workflows/ci.yml"
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_CI_RUN_ID" ]]; then
            run_id="$INPUT_CI_RUN_ID"
          else
            run_id="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                --json databaseId,headSha,headBranch,conclusion,event -L 100 \
                | jq -r --arg sha "$INPUT_SOURCE_SHA" --arg branch "$INPUT_BRANCH" \
                  'map(select(.headSha == $sha and .headBranch == $branch and .event == "push" and .conclusion == "success"))
                   | sort_by(.databaseId) | last | .databaseId // empty'
            )"
          fi
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful push CI run found for $INPUT_SOURCE_SHA on $INPUT_BRANCH." >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          if ! jq -e \
            --arg sha "$INPUT_SOURCE_SHA" \
            --arg branch "$INPUT_BRANCH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg path "$TRUSTED_CI_WORKFLOW_PATH" \
            --argjson workflow_id "$TRUSTED_CI_WORKFLOW_ID" \
            '.name == "CI"
             and .workflow_id == $workflow_id
             and .path == $path
             and .head_sha == $sha
             and .head_branch == $branch
             and .event == "push"
             and .conclusion == "success"
             and .run_attempt == 1
             and .head_repository.full_name == $repository' \
            <<<"$run_json" >/dev/null; then
            echo "::error::CI run $run_id is not the trusted successful push CI run for $INPUT_SOURCE_SHA on $INPUT_BRANCH." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download candidate artifacts from that run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.locate.outputs.run_id }}
          path: artifacts
          pattern: "candidate-linux-*"
          merge-multiple: false

      - name: Download the promotion manifest from that run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.locate.outputs.run_id }}
          name: promotion-manifest
          path: artifacts/manifest

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd artifacts
          amd64_tar="candidate-linux-amd64/image-linux-amd64.tar"
          arm64_tar="candidate-linux-arm64/image-linux-arm64.tar"
          sha256sum "$amd64_tar" "$arm64_tar" > actual.sha256
          # The recorded checksums file used the CI job's own relative paths;
          # compare content, not path spelling.
          diff <(awk '{print $1}' actual.sha256 | sort) <(awk '{print $1}' manifest/checksums.sha256 | sort)

      - name: Confirm candidate source and version
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$INPUT_SOURCE_SHA" \
            "refs/heads/$INPUT_BRANCH:refs/remotes/origin/$INPUT_BRANCH"
          if ! git merge-base --is-ancestor "$INPUT_SOURCE_SHA" "refs/remotes/origin/$INPUT_BRANCH"; then
            echo "::error::$INPUT_SOURCE_SHA does not belong to $INPUT_BRANCH." >&2
            exit 1
          fi
          git show "$INPUT_SOURCE_SHA:Dockerfile" \
            | uv run python -m scripts.validate_docker_base --candidate-dhi --stdin
          if [[ -n "$INPUT_TAG" ]]; then
            tag_refs="$(git ls-remote --tags origin "refs/tags/$INPUT_TAG" "refs/tags/$INPUT_TAG^{}")"
            tag_target_sha="$(
              awk -v ref="refs/tags/$INPUT_TAG" \
                '$2 == ref "^{}" { peeled = $1 } $2 == ref { direct = $1 }
                 END { if (peeled != "") print peeled; else if (direct != "") print direct }' \
                <<<"$tag_refs"
            )"
            if [[ -n "$tag_target_sha" && "$tag_target_sha" != "$INPUT_SOURCE_SHA" ]]; then
              echo "::error::Git tag $INPUT_TAG already points to $tag_target_sha, not $INPUT_SOURCE_SHA." >&2
              exit 1
            fi
          fi
          if ! git diff --quiet "$INPUT_SOURCE_SHA" HEAD -- \
            .github/workflows/ci.yml \
            scripts/build_promotion_manifest.py \
            scripts/docker_smoke_test.sh \
            scripts/release_metadata.py \
            scripts/validate_release.py \
            scripts/update_beta_latest.py \
            scripts/validate_docker_base.py \
            scripts/verify_build_evidence.py \
            scripts/verify_loaded_image.py \
            .github/workflows/auto-promote.yml; then
            echo "::error::Candidate pipeline files differ from trusted main. Merge main into $INPUT_BRANCH and rebuild." >&2
            exit 1
          fi
          committed_version="$(git show "$INPUT_SOURCE_SHA:pyproject.toml" | grep -m1 '^version = ' | sed -E 's/version = "(.*)"/\1/')"
          manifest_version="$(jq -r '.raw_version' artifacts/manifest/promotion-manifest.json)"
          if [[ "$committed_version" != "$manifest_version" ]]; then
            echo "::error::pyproject.toml at $INPUT_SOURCE_SHA has version $committed_version, manifest claims $manifest_version." >&2
            exit 1
          fi

      - name: Confirm the source commit belongs to a merged pull request
        # A merged PR is mandatory (direct pushes are rejected). A recorded
        # PR approval is not: admins may merge release PRs by bypassing branch
        # protection, so an unapproved merge is recorded as an audit warning
        # without creating another manual deployment approval.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_SOURCE_SHA/pulls" --jq 'map(select(.merged_at != null)) | first // empty')"
          pr_number="$(jq -r '.number // empty' <<<"$pr_json")"
          if [[ -z "$pr_number" ]]; then
            echo "::error::No merged pull request found for commit $INPUT_SOURCE_SHA." >&2
            exit 1
          fi
          merged_by="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.merged_by.login // "unknown"')"
          approvers="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews" --paginate --jq '.[] | select(.state == "APPROVED") | .user.login' | sort -u | paste -sd, -)"
          if [[ -n "$approvers" ]]; then
            echo "Pull request #$pr_number approved by: $approvers (merged by $merged_by)."
            summary="Source PR #$pr_number approved by \`$approvers\`, merged by \`$merged_by\`."
          else
            echo "::warning::Pull request #$pr_number for commit $INPUT_SOURCE_SHA was merged by $merged_by without a recorded approval (admin bypass). No additional deployment approval is required."
            summary="⚠️ Source PR #$pr_number was merged by \`$merged_by\` **without a recorded approval** (admin bypass); publication is automatic after CI and release validation."
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: List already-published version tags
        run: |
          set -euo pipefail
          uv run python -m scripts.list_docker_hub_tags > published-versions.txt

      - name: Revalidate the candidate manifest
        id: validate
        run: |
          set -euo pipefail
          args=(
            --manifest artifacts/manifest/promotion-manifest.json
            --source-sha "$INPUT_SOURCE_SHA"
            --branch "$INPUT_BRANCH"
            --channel "$INPUT_CHANNEL"
            --published-versions-file published-versions.txt
          )
          if [[ -n "$INPUT_TAG" ]]; then
            args+=(--tag "$INPUT_TAG")
          fi
          result="$(uv run python -m scripts.validate_promotion "${args[@]}")"
          echo "$result"
          {
            echo "raw_version=$(jq -r '.raw_version' <<<"$result")"
            echo "amd64_digest=$(jq -r '.platform_digests["linux/amd64"]' <<<"$result")"
            echo "arm64_digest=$(jq -r '.platform_digests["linux/arm64"]' <<<"$result")"
          } >> "$GITHUB_OUTPUT"
          jq -c '.expected_tags' <<<"$result" > expected-tags.json

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify build evidence before publication
        run: |
          set -euo pipefail
          for slug in linux-amd64 linux-arm64; do
            platform="linux/${slug#linux-}"
            uv run python -m scripts.verify_build_evidence \
              --archive "artifacts/candidate-$slug/image-$slug.tar" \
              --platform "$platform" --source-sha "$INPUT_SOURCE_SHA" \
              --allow-legacy \
              > "artifacts/publication-evidence-$slug.json"
            if [[ "$(jq -r '.format' "artifacts/publication-evidence-$slug.json")" == "oci" ]]; then
              git show "$INPUT_SOURCE_SHA:Dockerfile" | uv run python -m scripts.validate_docker_base --candidate-dhi --stdin
              expected="$(jq -r --arg platform "$platform" '.platform_digests[$platform]' artifacts/manifest/promotion-manifest.json)"
              uv run python -m scripts.verify_build_evidence \
                --archive "artifacts/candidate-$slug/image-$slug.tar" \
                --platform "$platform" --source-sha "$INPUT_SOURCE_SHA" \
                --expected-digest "$expected" --require-revision-label \
                > "artifacts/publication-evidence-$slug.json"
            else
              expected="$(jq -r --arg platform "$platform" '.platform_digests[$platform]' artifacts/manifest/promotion-manifest.json)"
              format="$(jq -r '.format' "artifacts/publication-evidence-$slug.json")"
              if [[ "$format" == "oci-legacy" ]]; then
                [[ "$(jq -r '.image_digest' "artifacts/publication-evidence-$slug.json")" == "$expected" ]] || {
                  echo "::error::Legacy OCI image differs from the tested platform digest." >&2
                  exit 1
                }
              else
                jq --arg digest "$expected" '.image_digest = $digest' \
                  "artifacts/publication-evidence-$slug.json" > "$RUNNER_TEMP/evidence.json"
                mv "$RUNNER_TEMP/evidence.json" "artifacts/publication-evidence-$slug.json"
              fi
            fi
          done

      - name: Push each tested platform image by digest
        # --all preserves the runnable manifest AND its BuildKit attestations.
        # Digest-only publication leaves no staging tags and never rebuilds.
        id: stage
        env:
          AMD64_DIGEST: ${{ steps.validate.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.validate.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          skopeo --version

          stage() {
            local slug="$1" arch="$2" expected="$3"
            local index_digest dest
            if [[ "$(jq -r '.format' "artifacts/publication-evidence-$slug.json")" == "oci" ]]; then
              index_digest="$(jq -r '.index_digest' "artifacts/publication-evidence-$slug.json")"
              dest="${IMAGE_NAME}@${index_digest}"
              skopeo copy --all --preserve-digests \
                --dest-authfile "$HOME/.docker/config.json" \
                "oci-archive:artifacts/candidate-${slug}/image-${slug}.tar" \
                "docker://${dest}"
              actual="$(skopeo inspect --authfile "$HOME/.docker/config.json" --raw "docker://${dest}" | sha256sum | awk '{print "sha256:" $1}')"
              if [[ "$actual" != "$index_digest" ]]; then
                echo "::error::Pushed ${arch} index $actual does not match build evidence $index_digest." >&2
                exit 1
              fi
            else
              index_digest="$expected"
              transport=docker-archive
              if [[ "$(jq -r '.format' "artifacts/publication-evidence-$slug.json")" == "oci-legacy" ]]; then
                transport=oci-archive
              fi
              skopeo copy --preserve-digests \
                --dest-authfile "$HOME/.docker/config.json" \
                "${transport}:artifacts/candidate-${slug}/image-${slug}.tar" \
                "docker://${IMAGE_NAME}@${expected}"
            fi
            actual="$(skopeo inspect --authfile "$HOME/.docker/config.json" --raw "docker://${IMAGE_NAME}@${expected}" | sha256sum | awk '{print "sha256:" $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Pushed ${arch} image $actual does not match tested digest $expected." >&2
              exit 1
            fi
            echo "${arch}_index=$index_digest" >> "$GITHUB_OUTPUT"
            echo "Pushed ${arch} at tested digest $expected."
          }

          stage linux-amd64 amd64 "$AMD64_DIGEST"
          stage linux-arm64 arm64 "$ARM64_DIGEST"

      - name: Assemble and publish the multi-arch manifest list
        id: publish
        env:
          RAW_VERSION: ${{ steps.validate.outputs.raw_version }}
          AMD64_INDEX: ${{ steps.stage.outputs.amd64_index }}
          ARM64_INDEX: ${{ steps.stage.outputs.arm64_index }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "${IMAGE_NAME}:${tag}")
          done < <(jq -r '.[]' expected-tags.json)

          docker buildx imagetools create "${tag_args[@]}" \
            "${IMAGE_NAME}@${AMD64_INDEX}" \
            "${IMAGE_NAME}@${ARM64_INDEX}"
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${RAW_VERSION}" --raw > artifacts/published-index.json
          uv run python -m scripts.verify_build_evidence \
            --published-index artifacts/published-index.json \
            --evidence artifacts/publication-evidence-linux-amd64.json \
            --evidence artifacts/publication-evidence-linux-arm64.json
          published_digest="sha256:$(sha256sum artifacts/published-index.json | awk '{print $1}')"
          echo "published_digest=$published_digest" >> "$GITHUB_OUTPUT"

      # actions/attest replaces the deprecated attest-build-provenance and
      # attest-sbom wrappers. Only the provenance attestation creates the
      # Artifact Metadata storage record (needs `artifact-metadata: write`);
      # the SBOM attestations describe the same subject, so they skip it.
      - name: Attest build provenance for the published manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.published_digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM for the published manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.published_digest }}
          sbom-path: artifacts/candidate-linux-amd64/sbom-linux-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Attest arm64 SBOM for the published manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.published_digest }}
          sbom-path: artifacts/candidate-linux-arm64/sbom-linux-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Update 2.0.0-beta-latest after publication and attestations
        id: beta_latest
        if: inputs.channel == 'beta'
        env:
          RAW_VERSION: ${{ steps.validate.outputs.raw_version }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.published_digest }}
        run: |
          set -euo pipefail
          result="$(uv run python -m scripts.update_beta_latest \
            --version "$RAW_VERSION" --digest "$PUBLISHED_DIGEST")"
          echo "$result"
          jq -r '.notice' <<<"$result" >> "$GITHUB_STEP_SUMMARY"
          echo "updated=$(jq -r '.updated' <<<"$result")" >> "$GITHUB_OUTPUT"
