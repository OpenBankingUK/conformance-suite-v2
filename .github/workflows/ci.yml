name: CI

on:
  pull_request:
    branches:
      - main
      - "preview/**"
  push:
    branches:
      - main
      - "preview/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        # Includes the dev dependency group by default (ruff, mypy, pytest, etc.)
        # --no-install-project: this is a container-deployed app, not a package
        run: uv sync --frozen --no-install-project

      - name: Run canonical quality gate
        # CI intentionally clears the local OpenAPI exclusion so every tracked
        # file is scanned for secrets.
        run: make check SECRET_SCAN_EXCLUDE_PATHSPEC=

      - name: Check release CHANGELOG entry
        # A PR that changes [project].version prepares a release. Its curated
        # CHANGELOG.md section becomes the GitHub Release summary, so GA
        # versions must have one before merge; betas only warn. PRs that leave
        # the version unchanged prepare no release and are not checked.
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF"
          git show FETCH_HEAD:pyproject.toml > "$RUNNER_TEMP/base-pyproject.toml"
          uv run python -m scripts.release_notes check-changelog \
            --pyproject pyproject.toml \
            --base-pyproject "$RUNNER_TEMP/base-pyproject.toml" \
            --changelog CHANGELOG.md

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      is_candidate: ${{ steps.classify.outputs.is_candidate }}
      is_hardened: ${{ steps.classify.outputs.is_hardened }}
      target_branch: ${{ steps.classify.outputs.target_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Classify this run
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          target_branch="$PUSH_REF_NAME"
          is_candidate=false
          is_hardened=false
          # Candidate publication requires the hardened image contract.
          # PR builds never publish, including feature branches targeting main.
          if python3 -m scripts.validate_docker_base --candidate-dhi --dockerfile Dockerfile \
            && grep -q '^USER 65532:65532$' Dockerfile \
            && [[ -f docker/entrypoint.py ]]; then
              is_hardened=true
          fi
          if [[ "$is_hardened" == "true" && "$EVENT_NAME" == "push" ]] \
            && { [[ "$target_branch" == "main" ]] || [[ "$target_branch" == preview/* ]]; }; then
              is_candidate=true
          fi

          {
            echo "target_branch=$target_branch"
            echo "is_hardened=$is_hardened"
            echo "is_candidate=$is_candidate"
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Build
    needs: plan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to dhi.io
        # Docker Hardened Images require registry authentication even to pull;
        # uses the repository-level read-only organisation token.
        if: needs.plan.outputs.is_hardened == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ob-conformance-tool:${{ github.sha }}
          build-args: |
            CONFORMANCE_TOOL_VERSION=0.0.0+ci.${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log out of dhi.io before running repository scripts
        # login-action leaves the credential in ~/.docker/config.json until
        # post-job cleanup; remove it once the private base has been pulled so
        # branch-controlled scripts below cannot read it.
        if: always() && needs.plan.outputs.is_hardened == 'true'
        run: docker logout dhi.io

      - name: Run hardened smoke test
        # The hardened image serves HTTPS with a generated certificate and has
        # no shell/curl, so it needs the dedicated smoke-test script.
        if: needs.plan.outputs.is_hardened == 'true'
        run: ./scripts/docker_smoke_test.sh ob-conformance-tool:${{ github.sha }}

      - name: Validate Compose configuration
        if: needs.plan.outputs.is_hardened == 'true'
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.certs.yaml config >/dev/null

      - name: Run container smoke test
        if: needs.plan.outputs.is_hardened != 'true'
        env:
          DJANGO_SECRET_KEY: "ci-dummy-key-not-for-production"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
        run: |
          docker run -d --name smoke \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -p 8443:8443 \
            ob-conformance-tool:${{ github.sha }}
          for _ in $(seq 1 10); do
            if curl -sf http://localhost:8443/health/; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

  image:
    # Builds and smoke-tests each platform on every PR and push. Publishing
    # credentials remain isolated in the trusted promotion workflow.
    name: Image (${{ matrix.platform }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      PR_SCOUT_PREVIEW: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Verify the pinned DHI image families
        if: needs.plan.outputs.is_hardened == 'true'
        run: uv run python -m scripts.validate_docker_base --candidate-dhi --dockerfile Dockerfile

      - name: Resolve runtime base for the Scout impact report
        id: runtime_base
        if: needs.plan.outputs.is_hardened == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          runtime_base="$(uv run python -m scripts.validate_docker_base --candidate-dhi --print-runtime-base --dockerfile Dockerfile)"
          echo "ref=$runtime_base" >> "$GITHUB_OUTPUT"

      - name: Resolve image version
        id: metadata
        env:
          IS_CANDIDATE: ${{ needs.plan.outputs.is_candidate }}
          TARGET_BRANCH: ${{ needs.plan.outputs.target_branch }}
        run: |
          set -euo pipefail
          if [[ "$IS_CANDIDATE" == "true" ]]; then
            result="$(uv run python -m scripts.validate_release --branch "$TARGET_BRANCH")"
            echo "$result"
            raw_version="$(jq -r '.raw_version' <<<"$result")"
          else
            raw_version="0.0.0+ci.${GITHUB_SHA}"
          fi
          echo "raw_version=$raw_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to dhi.io
        if: needs.plan.outputs.is_hardened == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Build image archive
        # OCI retains BuildKit's platform-bound attestations; the Docker
        # exporter drops them. Only the trusted promotion workflow can publish.
        # Provenance uses BuildKit's default SLSA version (v0.2 or v1).
        env:
          LOCAL_TAG: ob-conformance-candidate:${{ matrix.slug }}-${{ github.sha }}
          RAW_VERSION: ${{ steps.metadata.outputs.raw_version }}
        run: |
          mkdir -p artifacts
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg CONFORMANCE_TOOL_VERSION="$RAW_VERSION" \
            --build-arg SOURCE_REVISION="${{ github.sha }}" \
            --tag "$LOCAL_TAG" \
            --provenance=mode=max \
            --sbom=true \
            --output type=oci,oci-artifact=false,compression=gzip,force-compression=true,dest=artifacts/image-${{ matrix.slug }}.tar \
            --cache-from type=gha,scope=candidate-${{ matrix.slug }} \
            --cache-to type=gha,mode=max,scope=candidate-${{ matrix.slug }} \
            .

      - name: Report Docker Scout findings
        # Run before further repository scripts, with read-only Hub credentials.
        # Save the PR result independently of the optional published-beta comparison.
        if: env.PR_SCOUT_PREVIEW == 'true' || (matrix.slug == 'linux-amd64' && needs.plan.outputs.is_hardened == 'true')
        continue-on-error: true
        timeout-minutes: 10
        env:
          SCOUT_CLI_VERSION: "1.29.0"
          SCOUT_CLI_SHA256_AMD64: 9157cdc9372b478a8cd51dd53f5e9c74a7e34056ea291c65520bf76016fa72f4 # pragma: allowlist secret
          SCOUT_CLI_SHA256_ARM64: bcb16a65b7266413fea05e9dc352159485609e62a6cbd049207118b0aa7d8611 # pragma: allowlist secret
          COMPARE_BETA: ${{ matrix.slug == 'linux-amd64' && needs.plan.outputs.is_hardened == 'true' }}
          PUBLISHED_IMAGE: openbanking/conformance-suite-v2:2.0.0-beta-latest
          RUNTIME_BASE: ${{ steps.runtime_base.outputs.ref }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: artifacts/image-${{ matrix.slug }}.tar
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKER_ORG_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/scout-impact"
          # Remove all Scout state, which may include Docker Hub tokens,
          # before later steps run branch-controlled code.
          export DOCKER_SCOUT_CACHE_DIR="$work/cache"
          trap 'rm -rf "$work" "$HOME/.docker/scout"' EXIT
          trap 'echo "::warning title=Scout impact report incomplete::This informational report failed; see the step log. CI is not blocked."' ERR
          report="$RUNNER_TEMP/scout-preview"
          if [[ "$PR_SCOUT_PREVIEW" == "true" ]]; then
            mkdir -p "$report"
          fi
          if [[ -z "$DOCKER_SCOUT_HUB_USER" || -z "$DOCKER_SCOUT_HUB_PASSWORD" ]]; then
            echo "::notice title=Scout impact report skipped::Docker Hub credentials are unavailable to this run."
            if [[ "$PR_SCOUT_PREVIEW" == "true" ]]; then
              touch "$report/no-credentials"
            fi
            exit 0
          fi
          case "$RUNNER_ARCH" in
            X64) arch=amd64; checksum="$SCOUT_CLI_SHA256_AMD64" ;;
            ARM64) arch=arm64; checksum="$SCOUT_CLI_SHA256_ARM64" ;;
            *) echo "::warning::Unsupported Scout runner: $RUNNER_ARCH"; exit 1 ;;
          esac

          rm -rf "$work"
          mkdir -p "$work/oci" ~/.docker/cli-plugins
          cli="docker-scout_${SCOUT_CLI_VERSION}_linux_${arch}.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-max-time 60 -fsSL -o "$work/$cli" \
            "https://github.com/docker/scout-cli/releases/download/v${SCOUT_CLI_VERSION}/${cli}"
          echo "$checksum  $work/$cli" | sha256sum --check --status
          tar -xzf "$work/$cli" -C ~/.docker/cli-plugins docker-scout
          chmod +x ~/.docker/cli-plugins/docker-scout

          # The archive is an OCI layout. oci-dir:// keeps BuildKit's
          # provenance and SBOM visible to Scout, as on Docker Hub.
          tar -xf "$ARCHIVE" -C "$work/oci"

          if [[ "$PR_SCOUT_PREVIEW" == "true" ]]; then
            if ! docker scout vex get --verify --platform "$PLATFORM" \
                --output "$work/base.vex.json" "registry://$RUNTIME_BASE" \
                || [[ ! -s "$work/base.vex.json" ]]; then
              echo "::warning title=Scout preview unavailable::Could not retrieve and verify the signed runtime-base VEX for $PLATFORM."
              touch "$report/vex-unavailable"
              exit 0
            fi
            if docker scout cves "oci-dir://$work/oci" --platform "$PLATFORM" \
                --vex-location "$work/base.vex.json" \
                --format gitlab --output "$work/cves.json"; then
              mv "$work/cves.json" "$report/cves.json"
            else
              echo "::warning::Docker Scout could not scan the $PLATFORM image."
            fi
          fi
          if [[ "$COMPARE_BETA" != "true" ]]; then
            exit 0
          fi

          # Resolve the mutable beta tag once, then use the immutable manifest
          # reference for both provenance and Scout comparison.
          published_manifest_digest="$(
            docker buildx imagetools inspect "$PUBLISHED_IMAGE" --format '{{.Manifest.Digest}}'
          )" || published_manifest_digest=""
          if [[ ! "$published_manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::warning title=Scout impact report incomplete::Could not resolve the published beta to an immutable manifest digest."
            exit 0
          fi
          immutable_image="${PUBLISHED_IMAGE%:*}@${published_manifest_digest}"

          # Published provenance records the exact runtime base digest. Base
          # equality is reported separately from the candidate's findings.
          base_digest="${RUNTIME_BASE##*@}"
          published_base_digest="$(
            docker buildx imagetools inspect "$immutable_image" --format '{{json .Provenance}}' \
              | python3 -c '
          import json
          import re
          import sys
          from urllib.parse import parse_qs, unquote, urlsplit

          provenance = json.load(sys.stdin)
          platform, runtime_base = sys.argv[1:]
          base_name, _, _ = runtime_base.rpartition("@")
          repository, _, version = base_name.rpartition(":")
          purl_prefix = f"pkg:docker/{repository}@{version}"
          slsa = provenance.get(platform, {}).get("SLSA", {})
          materials = slsa.get("materials") or slsa.get("buildDefinition", {}).get("resolvedDependencies", [])
          for material in materials:
              uri = unquote(str(material.get("uri", "")))
              if uri.split("?", 1)[0].split("#", 1)[0] != purl_prefix:
                  continue
              digest_object = material.get("digest", {})
              digest = digest_object.get("sha256", "") if isinstance(digest_object, dict) else ""
              if not re.fullmatch(r"(?:sha256:)?[0-9a-fA-F]{64}", digest):
                  digest = parse_qs(urlsplit(uri).query).get("digest", [""])[0]
              match = re.fullmatch(r"(?:sha256:)?([0-9a-fA-F]{64})", digest)
              if match:
                  print("sha256:" + match.group(1).lower())
                  break
          ' "$PLATFORM" "$RUNTIME_BASE"
          )" || published_base_digest=""
          if [[ -z "$published_base_digest" ]]; then
            base_status="not found in the published image's provenance"
          elif [[ "$published_base_digest" == "$base_digest" ]]; then
            base_status="**unchanged** from the published image"
          else
            base_status="**changed** from the published \`${published_base_digest}\`"
          fi

          docker scout compare "oci-dir://$work/oci" --to "registry://$immutable_image" \
            --platform "$PLATFORM" --ignore-unchanged --format markdown --output "$work/compare.md"
          if [[ "$PR_SCOUT_PREVIEW" != "true" ]]; then
            docker scout cves "oci-dir://$work/oci" --platform "$PLATFORM" \
              --format only-packages --only-vuln-packages > "$work/cves.txt"
          fi

          {
            echo "## Docker Scout impact (${PLATFORM})"
            echo
            echo "Informational only. Compares this candidate with the published manifest \`${immutable_image}\`, as reported by Docker Hub's Scout view. Builder-stage, tooling, CI and dev-dependency changes do not ship, so they cannot change these results."
            echo
            echo "**Runtime base:** \`${RUNTIME_BASE}\` is ${base_status}. Base equality alone does not determine the candidate's vulnerability findings."
            echo
            # Render Scout's severity badges as text instead of third-party
            # images; the backticks are literal Markdown, not substitutions.
            # shellcheck disable=SC2016
            sed -E 's#<img alt="([^"]*)" src="[^"]*"/>#`\1`#g' "$work/compare.md"
            echo
            if [[ "$PR_SCOUT_PREVIEW" == "true" ]]; then
              echo "See **Docker Scout preview** for absolute findings and package details on both platforms."
            else
              echo "<details><summary>Vulnerable packages in this candidate</summary>"
              echo
              echo '```text'
              cat "$work/cves.txt"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of dhi.io before running repository scripts
        # login-action leaves the credential in ~/.docker/config.json until
        # post-job cleanup; remove it before any branch-controlled code runs.
        if: always() && needs.plan.outputs.is_hardened == 'true'
        run: docker logout dhi.io

      - name: Upload PR Scout report
        if: env.PR_SCOUT_PREVIEW == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scout-preview-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/scout-preview/cves.json
            ${{ runner.temp }}/scout-preview/no-credentials
            ${{ runner.temp }}/scout-preview/vex-unavailable
          retention-days: 7
          overwrite: true

      - name: Load image for local verification
        id: load
        env:
          LOCAL_TAG: ob-conformance-candidate:${{ matrix.slug }}-${{ github.sha }}
          IS_HARDENED: ${{ needs.plan.outputs.is_hardened }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$IS_HARDENED" == "true" ]]; then
            uv run python -m scripts.validate_docker_base --candidate-dhi --dockerfile Dockerfile
            args+=(--require-revision-label)
          fi
          uv run python -m scripts.verify_build_evidence \
            --archive artifacts/image-${{ matrix.slug }}.tar \
            --platform "${{ matrix.platform }}" --source-sha "${{ github.sha }}" \
            --add-docker-load-manifest \
            "${args[@]}" > artifacts/evidence-${{ matrix.slug }}.json
          # Only this local verification copy loses attestations. Promotion
          # consumes the original OCI archive, never the daemon's copy.
          skopeo copy --override-os linux --override-arch "${SLUG#linux-}" \
            "oci-archive:artifacts/image-${{ matrix.slug }}.tar" "docker-daemon:$LOCAL_TAG"
          docker image inspect --format '{{json .}}' "$LOCAL_TAG" \
            > artifacts/loaded-image-${{ matrix.slug }}.json
          uv run python -m scripts.verify_loaded_image \
            --evidence artifacts/evidence-${{ matrix.slug }}.json \
            --inspect artifacts/loaded-image-${{ matrix.slug }}.json
          echo "local_tag=$LOCAL_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify image OCI identity labels
        # Part of the hardened Docker contract; the legacy image has no labels.
        if: needs.plan.outputs.is_hardened == 'true'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.raw_version }}
          IMAGE_REF: ${{ steps.load.outputs.local_tag }}
        run: |
          set -euo pipefail
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_REF")"
          [[ "$revision" == "$EXPECTED_REVISION" ]]
          [[ "$version" == "$EXPECTED_VERSION" ]]

      - name: Run hardened smoke test
        if: needs.plan.outputs.is_hardened == 'true'
        run: ./scripts/docker_smoke_test.sh "${{ steps.load.outputs.local_tag }}"

      - name: Generate SBOM
        if: needs.plan.outputs.is_candidate == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.load.outputs.local_tag }}
          format: spdx-json
          output-file: artifacts/sbom-${{ matrix.slug }}.spdx.json

      - name: Upload candidate artifacts
        if: needs.plan.outputs.is_candidate == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.slug }}
          path: |
            artifacts/image-${{ matrix.slug }}.tar
            artifacts/evidence-${{ matrix.slug }}.json
            artifacts/sbom-${{ matrix.slug }}.spdx.json
          retention-days: 14

  scout-preview:
    name: Docker Scout preview
    needs: image
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Download PR Scout reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: scout-preview-linux-*
          path: reports

      - name: View vulnerability report (packages and CVEs)
        run: |
          set -euo pipefail
          scanned=()
          {
            echo '## Docker Scout preview'
            echo
            echo "Final runtime images for PR merge commit \`$GITHUB_SHA\`. Findings are informational, not a merge gate."
            echo
            echo '| Platform | Critical | High | Medium | Low | Unspecified | Result |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: | --- |'
            for arch in amd64 arm64; do
              dir="reports/scout-preview-linux-$arch"
              # GitLab-format Scout reports contain one entry per affected package/advisory.
              # Only a complete, successful report with a known schema may produce zeros.
              if [[ -f "$dir/cves.json" ]] && counts="$(jq -er '
                select(.scan.status == "success") | .vulnerabilities | select(type == "array")
                | map(.severity) as $found | ["Critical","High","Medium","Low","Unknown"] as $levels
                | select(($found - $levels) == [])
                | [$levels[] as $s | $found | map(select(. == $s)) | length] | join(" | ")
              ' "$dir/cves.json")" && [[ -n "$counts" ]]; then
                scanned+=("$arch")
                echo "| linux/$arch | $counts | Scanned |"
              elif [[ -f "$dir/no-credentials" ]]; then
                echo "| linux/$arch | - | - | - | - | - | Unavailable: no Docker Hub credentials |"
              elif [[ -f "$dir/vex-unavailable" ]]; then
                echo "| linux/$arch | - | - | - | - | - | Unavailable: signed runtime-base VEX could not be verified |"
              else
                echo "| linux/$arch | - | - | - | - | - | Unavailable: see the Image job |"
              fi
            done
            echo
            echo 'These are package/advisory findings in the PR build. Docker Hub can apply registry-side VEX assessments after publication, so its counts may differ.'
            echo
            echo "Expand **View vulnerability report (packages and CVEs)** in the **Docker Scout preview** job for details, or download the \`scout-preview-linux-*\` [JSON artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if (( ${#scanned[@]} == 0 )); then exit 0; fi

          # Package and advisory text comes from the PR image, not the workflow.
          marker="$(uuidgen)"
          echo "::stop-commands::$marker"
          for arch in "${scanned[@]}"; do
            printf '\nPackage findings for linux/%s\n' "$arch"
            jq -r '
              .vulnerabilities | if length == 0 then "No findings." else
                (["Severity", "Advisory", "Package", "Installed version"],
                 (sort_by(.severity as $s | ["Critical","High","Medium","Low","Unknown"] | index($s))[]
                  | [.severity, (.identifiers[0].value // .cve // "Not reported"),
                     (.location.dependency.package.name // "Not reported"),
                     (.location.dependency.version // "Not reported")])) | @tsv
              end
            ' "reports/scout-preview-linux-$arch/cves.json"
          done
          echo "::$marker::"

  candidate-manifest:
    name: Assemble promotion manifest
    needs: [plan, check, image]
    if: needs.plan.outputs.is_candidate == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Download amd64 candidate metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-linux-amd64
          path: artifacts/linux-amd64

      - name: Download arm64 candidate metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-linux-arm64
          path: artifacts/linux-arm64

      - name: Compute artifact checksums
        run: |
          sha256sum artifacts/linux-amd64/image-linux-amd64.tar artifacts/linux-arm64/image-linux-arm64.tar > artifacts/checksums.sha256

      - name: Build promotion manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ needs.plan.outputs.target_branch }}
        run: |
          set -euo pipefail
          # Buildx's containerimage.digest is now the attested index, not the
          # runnable manifest. The promotion contract binds the tested leaf.
          amd64_digest="$(jq -r '.image_digest' artifacts/linux-amd64/evidence-linux-amd64.json)"
          arm64_digest="$(jq -r '.image_digest' artifacts/linux-arm64/evidence-linux-arm64.json)"
          raw_version="$(
            uv run python -c \
              'from pathlib import Path; from scripts.release_metadata import read_pyproject_raw_version; print(read_pyproject_raw_version(Path("pyproject.toml")))'
          )"

          uv run python -m scripts.build_promotion_manifest \
            --branch "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" \
            --platform-digest "linux/amd64=$amd64_digest" \
            --platform-digest "linux/arm64=$arm64_digest" \
            --oci-label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --oci-label "org.opencontainers.image.version=$raw_version" \
            --output artifacts/promotion-manifest.json

      - name: Upload promotion manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-manifest
          path: |
            artifacts/promotion-manifest.json
            artifacts/checksums.sha256
          retention-days: 90
