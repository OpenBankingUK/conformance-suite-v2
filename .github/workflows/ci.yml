name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "preview/**"
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - develop
      - "preview/**"
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        # Includes the dev dependency group by default (ruff, mypy, pytest, etc.)
        # --no-install-project: this is a container-deployed app, not a package
        run: uv sync --frozen --no-install-project

      - name: Run canonical quality gate
        # CI intentionally clears the local OpenAPI exclusion so every tracked
        # file is scanned for secrets.
        run: make check SECRET_SCAN_EXCLUDE_PATHSPEC=

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      is_candidate: ${{ steps.classify.outputs.is_candidate }}
      is_hardened: ${{ steps.classify.outputs.is_hardened }}
      target_branch: ${{ steps.classify.outputs.target_branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Classify this run
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        run: |
          target_branch="$PUSH_REF_NAME"
          is_candidate=false
          is_hardened=false
          # Bootstrap compatibility gate: main keeps its existing Docker CI
          # until the hardened Docker implementation lands. The hardened
          # contract is DHI base, distroless UID, and entrypoint; candidate
          # builds start automatically on eligible push branches once present.
          if python3 -m scripts.validate_docker_base --dockerfile Dockerfile \
            && grep -q '^USER 65532:65532$' Dockerfile \
            && [[ -f docker/entrypoint.py ]]; then
              is_hardened=true
          fi
          if [[ "$is_hardened" == "true" && "$EVENT_NAME" == "push" ]] \
            && { [[ "$target_branch" == "main" ]] || [[ "$target_branch" == preview/* ]] || [[ "$target_branch" == release/* ]]; }; then
              is_candidate=true
          fi

          {
            echo "target_branch=$target_branch"
            echo "is_hardened=$is_hardened"
            echo "is_candidate=$is_candidate"
          } >> "$GITHUB_OUTPUT"

  docker-build:
    name: Docker Build
    needs: plan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to dhi.io
        # Docker Hardened Images require registry authentication even to pull;
        # uses the repository-level read-only organisation token.
        if: needs.plan.outputs.is_hardened == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ob-conformance-tool:${{ github.sha }}
          build-args: |
            CONFORMANCE_TOOL_VERSION=0.0.0+ci.${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run hardened smoke test
        # The hardened image serves HTTPS with a generated certificate and has
        # no shell/curl, so it needs the dedicated smoke-test script.
        if: needs.plan.outputs.is_hardened == 'true'
        run: ./scripts/docker_smoke_test.sh ob-conformance-tool:${{ github.sha }}

      - name: Validate Compose configuration
        if: needs.plan.outputs.is_hardened == 'true'
        run: |
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.certs.yaml config >/dev/null

      - name: Run container smoke test
        if: needs.plan.outputs.is_hardened != 'true'
        env:
          DJANGO_SECRET_KEY: "ci-dummy-key-not-for-production"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
        run: |
          docker run -d --name smoke \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -p 8443:8443 \
            ob-conformance-tool:${{ github.sha }}
          for _ in $(seq 1 10); do
            if curl -sf http://localhost:8443/health/; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true

  candidate-image:
    name: Candidate image (${{ matrix.platform }})
    needs: [plan, check]
    if: needs.plan.outputs.is_candidate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Verify the assessed DHI runtime base
        # This must pass before building or either scanner can consume the
        # Snyk policy / Docker-signed VEX assessment for the exact base digest.
        run: uv run python -m scripts.validate_docker_base --dockerfile Dockerfile

      - name: Validate release metadata for this branch
        id: metadata
        env:
          TARGET_BRANCH: ${{ needs.plan.outputs.target_branch }}
        run: |
          set -euo pipefail
          result="$(uv run python -m scripts.validate_release --branch "$TARGET_BRANCH")"
          echo "$result"
          {
            echo "raw_version=$(jq -r '.raw_version' <<<"$result")"
            echo "channel=$(jq -r '.channel' <<<"$result")"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to dhi.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ORG_USERNAME }}
          password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Build candidate image
        # Exported as an OCI-loadable docker archive artifact rather than
        # pushed anywhere. The plan requires candidate images are never
        # published to Docker Hub before the matching approval gate; the promotion
        # workflow downloads this exact artifact and pushes it byte-for-byte,
        # it never rebuilds. Tagging during export gives docker load a stable
        # local name; the buildx digest is not guaranteed to be a Docker image ID.
        env:
          LOCAL_TAG: ob-conformance-candidate:${{ matrix.slug }}-${{ github.sha }}
        run: |
          mkdir -p artifacts
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg CONFORMANCE_TOOL_VERSION="${{ steps.metadata.outputs.raw_version }}" \
            --build-arg SOURCE_REVISION="${{ github.sha }}" \
            --tag "$LOCAL_TAG" \
            --output type=docker,dest=artifacts/image-${{ matrix.slug }}.tar \
            --metadata-file artifacts/metadata-${{ matrix.slug }}.json \
            --cache-from type=gha,scope=candidate-${{ matrix.slug }} \
            --cache-to type=gha,mode=max,scope=candidate-${{ matrix.slug }} \
            .

      - name: Load candidate image for local verification
        id: load
        env:
          LOCAL_TAG: ob-conformance-candidate:${{ matrix.slug }}-${{ github.sha }}
        run: |
          set -euo pipefail
          docker load --input artifacts/image-${{ matrix.slug }}.tar
          echo "local_tag=$LOCAL_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify candidate OCI identity labels
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ steps.metadata.outputs.raw_version }}
          IMAGE_REF: ${{ steps.load.outputs.local_tag }}
        run: |
          set -euo pipefail
          revision="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          version="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_REF")"
          [[ "$revision" == "$EXPECTED_REVISION" ]]
          [[ "$version" == "$EXPECTED_VERSION" ]]

      - name: Run hardened smoke test
        run: ./scripts/docker_smoke_test.sh "${{ steps.load.outputs.local_tag }}"

      - name: Scan for vulnerabilities with Snyk
        # Snyk remains the primary company scanner. Its narrowly scoped
        # expiring policy covers only the two Docker OpenVEX-assessed base CVEs.
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install --global snyk@1.1298.2
          snyk container test "${{ steps.load.outputs.local_tag }}" \
            --file=Dockerfile \
            --severity-threshold=high \
            --policy-path=.snyk

      - name: Install Docker Scout CLI
        # Pin the release and verify its architecture-specific archive before
        # installing the Docker CLI plugin.
        env:
          SCOUT_CLI_VERSION: "1.24.0"
          SCOUT_CLI_SHA256_AMD64: f4e2814bd61040365153d5b964b144cb2dc6ee536a68b5bac4cadf00fc0ec34b # pragma: allowlist secret
          SCOUT_CLI_SHA256_ARM64: 8b21594c72d4d9403a82a49e9dbdfc04c27c6a21933906f1eefbb0beabe22d58 # pragma: allowlist secret
        run: |
          set -euo pipefail
          case "${{ matrix.slug }}" in
            linux-amd64) goarch=amd64; checksum="$SCOUT_CLI_SHA256_AMD64" ;;
            linux-arm64) goarch=arm64; checksum="$SCOUT_CLI_SHA256_ARM64" ;;
            *) echo "::error::Unhandled matrix slug ${{ matrix.slug }} for Docker Scout CLI install." >&2; exit 1 ;;
          esac
          archive="docker-scout_${SCOUT_CLI_VERSION}_linux_${goarch}.tar.gz"
          curl -fsSLO "https://github.com/docker/scout-cli/releases/download/v${SCOUT_CLI_VERSION}/${archive}"
          echo "${checksum}  ${archive}" | sha256sum --check --status
          mkdir -p ~/.docker/cli-plugins
          tar -xzf "$archive" -C ~/.docker/cli-plugins docker-scout
          chmod +x ~/.docker/cli-plugins/docker-scout
          rm -f "$archive"
          docker scout version

      - name: Fetch signed VEX statement for the DHI runtime base image
        # The Scout CLI authenticates via DOCKER_SCOUT_HUB_* rather than the
        # dhi.io registry login above; the read-only org token is sufficient.
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKER_ORG_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          base_ref="$(uv run python -m scripts.validate_docker_base --print-runtime-base)"
          docker scout vex get "$base_ref" \
            --platform "${{ matrix.platform }}" \
            --output artifacts/base-image.vex.json

      - name: Scan for vulnerabilities with Docker Scout (VEX-aware)
        # Signed Docker OpenVEX assessments suppress only base-image CVEs that
        # Docker marks not_affected; real application dependency findings still
        # block promotion.
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKER_ORG_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}
        run: |
          docker scout cves "${{ steps.load.outputs.local_tag }}" \
            --vex-location artifacts/base-image.vex.json \
            --only-severity critical,high \
            --exit-code

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.load.outputs.local_tag }}
          format: spdx-json
          output-file: artifacts/sbom-${{ matrix.slug }}.spdx.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.slug }}
          path: |
            artifacts/image-${{ matrix.slug }}.tar
            artifacts/metadata-${{ matrix.slug }}.json
            artifacts/sbom-${{ matrix.slug }}.spdx.json
          retention-days: 14

  candidate-manifest:
    name: Assemble promotion manifest
    needs: [plan, candidate-image]
    if: needs.plan.outputs.is_candidate == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install release-tooling dependencies
        run: uv sync --frozen --no-install-project

      - name: Download amd64 candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-linux-amd64
          path: artifacts/linux-amd64

      - name: Download arm64 candidate metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-linux-arm64
          path: artifacts/linux-arm64

      - name: Compute artifact checksums
        run: |
          sha256sum artifacts/linux-amd64/image-linux-amd64.tar artifacts/linux-arm64/image-linux-arm64.tar > artifacts/checksums.sha256

      - name: Build promotion manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ needs.plan.outputs.target_branch }}
        run: |
          set -euo pipefail
          amd64_digest="$(jq -r '."containerimage.digest"' artifacts/linux-amd64/metadata-linux-amd64.json)"
          arm64_digest="$(jq -r '."containerimage.digest"' artifacts/linux-arm64/metadata-linux-arm64.json)"
          raw_version="$(
            uv run python -c \
              'from pathlib import Path; from scripts.release_metadata import read_pyproject_raw_version; print(read_pyproject_raw_version(Path("pyproject.toml")))'
          )"

          uv run python -m scripts.build_promotion_manifest \
            --branch "$TARGET_BRANCH" \
            --source-sha "$SOURCE_SHA" \
            --platform-digest "linux/amd64=$amd64_digest" \
            --platform-digest "linux/arm64=$arm64_digest" \
            --oci-label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --oci-label "org.opencontainers.image.version=$raw_version" \
            --output artifacts/promotion-manifest.json

      - name: Upload promotion manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-manifest
          path: |
            artifacts/promotion-manifest.json
            artifacts/checksums.sha256
          retention-days: 90
