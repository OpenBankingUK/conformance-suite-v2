name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
  push:
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        # Includes the dev dependency group by default (ruff, mypy, pytest, etc.)
        # --no-install-project: this is a container-deployed app, not a package
        run: uv sync --frozen --no-install-project

      - name: Run canonical quality gate
        # CI intentionally clears the local OpenAPI exclusion so every tracked
        # file is scanned for secrets.
        run: make check SECRET_SCAN_EXCLUDE_PATHSPEC=

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: ob-conformance-tool:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container smoke test
        env:
          DJANGO_SECRET_KEY: "ci-dummy-key-not-for-production"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
        run: |
          docker run -d --name smoke \
            -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            -e DJANGO_ALLOWED_HOSTS="$DJANGO_ALLOWED_HOSTS" \
            -p 8443:8443 \
            ob-conformance-tool:${{ github.sha }}
          # Wait for the server to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8443/health/; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become healthy"
          docker logs smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f smoke || true
