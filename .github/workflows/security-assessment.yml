name: Trusted security assessment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI run ID to assess again (a fresh assessment run is required).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: security-assessment-${{ inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    outputs:
      check_id: ${{ steps.identity.outputs.check_id }}
      check_sha: ${{ steps.identity.outputs.check_sha }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      source_branch: ${{ steps.identity.outputs.source_branch }}
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      hardened: ${{ steps.source.outputs.hardened }}
      runtime_base: ${{ steps.source.outputs.runtime_base }}
      pr_number: ${{ steps.identity.outputs.pr_number }}

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install trusted policy dependencies
        run: uv sync --frozen --no-install-project

      - name: Download candidate context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          name: candidate-context
          path: ${{ runner.temp }}/candidate-context

      - name: Validate the CI run and create its pending check
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          EXPECTED_CI_WORKFLOW_ID: "268848247"
          EXPECTED_CI_WORKFLOW_PATH: ".github/workflows/ci.yml"
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be a numeric GitHub Actions run ID." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Manual reassessments must be dispatched from main." >&2
            exit 1
          fi
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg path "$EXPECTED_CI_WORKFLOW_PATH" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflow_id "$EXPECTED_CI_WORKFLOW_ID" \
            '.workflow_id == $workflow_id
             and .path == $path
             and .name == "CI"
             and .head_repository.full_name == $repository
             and .run_attempt == 1
             and .conclusion == "success"
             and (.event == "push" or .event == "pull_request")' \
            <<<"$run_json" >/dev/null || {
              echo "::error::CI run is not an eligible, successful first-attempt run from this repository." >&2
              exit 1
            }
          run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          source_branch="$(jq -r '.head_branch' <<<"$run_json")"
          source_event="$(jq -r '.event' <<<"$run_json")"
          candidate_run_id="$(jq -r '.id' <<<"$run_json")"
          context="$RUNNER_TEMP/candidate-context/artifacts/candidate-context.json"
          source_sha=""
          check_sha="$run_head_sha"
          pr_number=""
          base_sha=""
          if [[ "$source_event" == "pull_request" ]]; then
            artifact_prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$run_head_sha/pulls")"
            matched_pr="$(jq -c --arg branch "$source_branch" --arg head "$run_head_sha" \
              '[.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY and .head.ref == $branch and .head.sha == $head)] | if length == 1 then .[0] else empty end' \
              <<<"$artifact_prs")"
            if [[ -z "$matched_pr" ]]; then
              echo "::error::Could not identify exactly one same-repository pull request for CI run $SOURCE_RUN_ID." >&2
              exit 1
            fi
            pr_number="$(jq -r '.number' <<<"$matched_pr")"
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            check_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
            jq -e --arg head "$run_head_sha" --arg branch "$source_branch" \
              '.state == "open" and .head.repo.full_name == env.GITHUB_REPOSITORY and .head.sha == $head and .head.ref == $branch' \
              <<<"$pr_json" >/dev/null || {
                echo "::error::The pull request is no longer open or its head no longer matches the CI run." >&2
                exit 1
              }
            source_sha="$(jq -r '.workflow_sha' "$context")"
            [[ "$source_sha" != "$check_sha" ]] || {
              echo "::error::Pull-request CI did not use a distinct synthetic merge commit." >&2
              exit 1
            }
          else
            source_sha="$(jq -r '.workflow_sha' "$context")"
            [[ "$source_sha" == "$run_head_sha" ]] || {
              echo "::error::Push candidate context does not match the CI run's commit." >&2
              exit 1
            }
          fi
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$candidate_run_id" \
            --arg event "$source_event" \
            --arg branch "$source_branch" \
            --arg sha "$source_sha" \
            --arg pr_number "$pr_number" \
            --arg check_sha "$check_sha" \
            --arg base_sha "$base_sha" \
            '.schema_version == 1
             and .repository == $repository
             and (.run_id | tostring) == $run_id
             and .run_attempt == 1
             and .event == $event
             and .workflow_sha == $sha
             and .workflow_sha_under_test == $sha
             and (if $event == "pull_request" then
               (.pull_request.number | tostring) == $pr_number
               and .pull_request.head_sha == $check_sha
               and .pull_request.base_sha == $base_sha
               and .head_ref == $branch
             else
               .pull_request == null
               and .ref_name == $branch
             end)' \
            "$context" >/dev/null || {
              echo "::error::Candidate context does not match the authoritative CI run and pull-request identity." >&2
              exit 1
            }
          if [[ -n "$pr_number" ]]; then
            parents="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '[.parents[].sha]')"
            jq -e --arg base "$base_sha" --arg head "$check_sha" \
              '. == [$base, $head]' <<<"$parents" >/dev/null || {
                echo "::error::The CI merge commit no longer has the verified pull-request base and head parents." >&2
                exit 1
              }
          fi
          artifact_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          jq -e '[.artifacts[] | select(.name == "candidate-context" and .expired == false)] | length == 1' \
            <<<"$artifact_ids" >/dev/null || {
              echo "::error::The CI run must contain exactly one unexpired candidate-context artifact." >&2
              exit 1
            }
          check_json="$(jq -n \
            --arg name "Vulnerability Scan" \
            --arg head_sha "$check_sha" \
            --arg details_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{name:$name, head_sha:$head_sha, status:"in_progress", details_url:$details_url, output:{title:"Trusted vulnerability assessment",summary:"Validating candidate identity and scanning both supported platforms."}}')"
          check_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input <(printf '%s' "$check_json") --jq '.id')"
          {
            echo "source_run_id=$candidate_run_id"
            echo "source_sha=$source_sha"
            echo "source_branch=$source_branch"
            echo "check_sha=$check_sha"
            echo "check_id=$check_id"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Verify context and retrieve candidate files as data
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.identity.outputs.source_run_id }}
          SOURCE_BRANCH: ${{ steps.identity.outputs.source_branch }}
          PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
          CHECK_SHA: ${{ steps.identity.outputs.check_sha }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/candidate-context/artifacts/candidate-context.json"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          pr_base_sha=""
          if [[ -n "$PR_NUMBER" ]]; then
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            pr_base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
            jq -e --arg head "$CHECK_SHA" --arg branch "$SOURCE_BRANCH" \
              '.state == "open" and .head.sha == $head and .head.ref == $branch' \
              <<<"$pr_json" >/dev/null || {
                echo "::error::The pull request head changed or the pull request is no longer open." >&2
                exit 1
              }
            parents="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '[.parents[].sha]')"
            jq -e --arg base "$pr_base_sha" --arg head "$CHECK_SHA" \
              '. == [$base, $head]' <<<"$parents" >/dev/null || {
                echo "::error::The candidate merge commit no longer matches the current pull-request base and head." >&2
                exit 1
              }
          fi
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg event "$(jq -r '.event' <<<"$run_json")" \
            --arg workflow_sha "$SOURCE_SHA" \
            --arg pr_number "$PR_NUMBER" \
            --arg check_sha "$CHECK_SHA" \
            --arg base_sha "$pr_base_sha" \
            '.schema_version == 1
             and .repository == $repository
             and (.run_id | tostring) == $run_id
             and .run_attempt == 1
             and .event == $event
             and .workflow_sha == $workflow_sha
             and .workflow_sha_under_test == $workflow_sha
             and (if $event == "pull_request" then
               (.pull_request.number | tostring) == $pr_number
               and .pull_request.head_sha == $check_sha
               and .pull_request.base_sha == $base_sha
               and .head_ref == $source_branch
             else
               .ref_name == $source_branch
             end)' \
            "$context" >/dev/null || {
              echo "::error::Candidate context does not match the authoritative CI run and pull-request identity." >&2
              exit 1
            }

          mkdir -p "$RUNNER_TEMP/assessment-inputs"
          for file in Dockerfile pyproject.toml uv.lock; do
            content="$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/$file" -f ref="$SOURCE_SHA" --jq '.content')"
            [[ -n "$content" && "$content" != "null" ]] || {
              echo "::error::Could not retrieve $file at the candidate commit." >&2
              exit 1
            }
            printf '%s' "$content" | base64 --decode > "$RUNNER_TEMP/assessment-inputs/$file"
          done
          hardened=false
          runtime_base=""
          if uv run python -m scripts.validate_docker_base \
            --candidate-dhi --print-runtime-base \
            --dockerfile "$RUNNER_TEMP/assessment-inputs/Dockerfile" > "$RUNNER_TEMP/runtime-base.txt"; then
            hardened=true
            runtime_base="$(cat "$RUNNER_TEMP/runtime-base.txt")"
          fi
          echo "hardened=$hardened" >> "$GITHUB_OUTPUT"
          echo "runtime_base=$runtime_base" >> "$GITHUB_OUTPUT"

      - name: Upload verified assessment inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-assessment-inputs
          path: ${{ runner.temp }}/assessment-inputs
          retention-days: 7

  scan:
    name: Scan (${{ matrix.platform }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install trusted policy dependencies
        run: uv sync --frozen --no-install-project

      - name: Download verified inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-assessment-inputs
          path: ${{ runner.temp }}/assessment-inputs

      - name: Download candidate image archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify.outputs.source_run_id }}
          name: candidate-${{ matrix.slug }}
          path: ${{ runner.temp }}/candidate

      - name: Load candidate image
        id: image
        env:
          SLUG: ${{ matrix.slug }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/candidate/image-$SLUG.tar"
          echo "reference=ob-conformance-candidate:$SLUG-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Scan and assess
        id: assessment
        uses: ./.github/actions/vulnerability-scan
        with:
          image: ${{ steps.image.outputs.reference }}
          image-source: local
          platform: ${{ matrix.platform }}
          target: "Candidate ${{ needs.verify.outputs.source_sha }} (${{ matrix.platform }})"
          vex-image: ${{ needs.verify.outputs.runtime_base }}
          vex-requires-dhi-login: ${{ needs.verify.outputs.hardened }}
          lock-directory: ${{ runner.temp }}/assessment-inputs
          dockerfile: ${{ runner.temp }}/assessment-inputs/Dockerfile
          gate-directory: .
          exceptions-file: security/vulnerability-exceptions.toml
          report-name: trusted-assessment-${{ matrix.slug }}
          sarif-category: candidate-image-${{ matrix.slug }}
          fail-on-findings: "false"
          verify-dhi-provenance: ${{ needs.verify.outputs.hardened }}
          allow-exceptions: "false"
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          docker-username: ${{ secrets.DOCKER_ORG_USERNAME }}
          docker-password: ${{ secrets.DOCKER_ORG_ACCESS_TOKEN }}

      - name: Save platform decision
        env:
          DECISION: ${{ steps.assessment.outputs.decision }}
          PROVENANCE: ${{ steps.assessment.outputs.provenance }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          jq -n --arg platform "$SLUG" --arg decision "$DECISION" --arg provenance "$PROVENANCE" \
            '{platform:$platform, decision:$decision, provenance:$provenance}' > "$RUNNER_TEMP/decision-$SLUG.json"

      - name: Upload platform decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assessment-${{ matrix.slug }}
          path: ${{ runner.temp }}/decision-${{ matrix.slug }}.json
          retention-days: 30

  decide:
    name: Combine assessment decisions
    needs: [verify, scan]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    outputs:
      decision: ${{ steps.combine.outputs.decision }}
      approval_phrase: ${{ steps.combine.outputs.approval_phrase }}

    steps:
      - name: Download platform decisions
        id: decisions
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assessment-*
          path: ${{ runner.temp }}/decisions
          merge-multiple: true

      - name: Combine decisions and bind any approval to the candidate
        id: combine
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          SOURCE_RUN_ID: ${{ needs.verify.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          CHECK_SHA: ${{ needs.verify.outputs.check_sha }}
          WORKFLOW_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          decision=blocked
          files=("$RUNNER_TEMP"/decisions/decision-*.json)
          if [[ "$SCAN_RESULT" == "success" && "${#files[@]}" -eq 2 ]]; then
            if ! decision="$(jq -nr \
              --slurpfile amd64 "$RUNNER_TEMP/decisions/decision-linux-amd64.json" \
              --slurpfile arm64 "$RUNNER_TEMP/decisions/decision-linux-arm64.json" '
              if ($amd64 | length) != 1 or ($arm64 | length) != 1 then "blocked"
              else $amd64 + $arm64 |
              if (all(.[]; type == "object"
                    and (.decision == "pass" or .decision == "approval_required" or .decision == "blocked")) | not)
              then "blocked"
              elif (map(.platform) | sort) != ["linux-amd64", "linux-arm64"] then "blocked"
              elif any(.[]; .decision == "blocked") then "blocked"
              elif any(.[]; .decision == "approval_required") then "approval_required"
              else "pass" end end')"; then
              echo "::error::Platform decision evidence is malformed; assessment is blocked." >&2
              decision=blocked
            fi
          fi
          phrase="APPROVE $WORKFLOW_SHA"
          {
            echo "decision=$decision"
            echo "approval_phrase=$phrase"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Trusted vulnerability assessment"
            echo
            echo "- Candidate image commit: \`$WORKFLOW_SHA\`"
            echo "- Pull-request check commit: \`$CHECK_SHA\`"
            echo "- Decision: \`$decision\`"
            if [[ "$decision" == "approval_required" ]]; then
              echo "- To accept only an unfixed high/critical/unknown finding or explicitly missing DHI provenance, approve the \`security-exception\` environment with this exact comment: \`$phrase\`."
            elif [[ "$decision" == "blocked" ]]; then
              echo "- Fixable findings, invalid evidence, malformed policy data, and scanner errors cannot be overridden."
            fi
            echo
            echo "Review both platform vulnerability report artifacts before approving."
          } >> "$GITHUB_STEP_SUMMARY"
          jq -n \
            --arg decision "$decision" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg checked_sha "$CHECK_SHA" \
            --arg approval_phrase "$phrase" \
            '{schema_version:1,decision:$decision,source_run_id:($source_run_id|tonumber),source_sha:$source_sha,checked_sha:$checked_sha,approval_phrase:$approval_phrase}' \
            > "$RUNNER_TEMP/assessment-receipt.json"

      - name: Upload candidate-bound assessment receipt
        if: steps.combine.outputs.decision == 'pass'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-assessment-receipt
          path: ${{ runner.temp }}/assessment-receipt.json
          if-no-files-found: error
          retention-days: 30

  approve-exception:
    name: Approve candidate risk exception
    needs: [verify, decide]
    if: needs.decide.outputs.decision == 'approval_required'
    runs-on: ubuntu-latest
    environment: security-exception
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - name: Require a fresh, candidate-bound environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PHRASE: ${{ needs.decide.outputs.approval_phrase }}
        run: |
          set -euo pipefail
          approvals="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals?per_page=100")"
          jq -e --arg phrase "$EXPECTED_PHRASE" '
            any(.[];
              .state == "approved"
              and .comment == $phrase
              and any(.environments[]?; .name == "security-exception")
            )' <<<"$approvals" >/dev/null || {
              echo "::error::The security-exception environment approval is missing or is not bound to the exact candidate SHA." >&2
              exit 1
            }

      - name: Create candidate-bound approval receipt
        env:
          SOURCE_RUN_ID: ${{ needs.verify.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          CHECK_SHA: ${{ needs.verify.outputs.check_sha }}
          APPROVAL_PHRASE: ${{ needs.decide.outputs.approval_phrase }}
        run: |
          set -euo pipefail
          jq -n \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg checked_sha "$CHECK_SHA" \
            --arg approval_phrase "$APPROVAL_PHRASE" \
            '{schema_version:1,decision:"approved",source_run_id:($run_id|tonumber),source_sha:$source_sha,checked_sha:$checked_sha,approval_phrase:$approval_phrase}' \
            > "$RUNNER_TEMP/assessment-receipt.json"

      - name: Upload candidate-bound approval receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-assessment-receipt
          path: ${{ runner.temp }}/assessment-receipt.json
          if-no-files-found: error
          retention-days: 30

  complete:
    name: Complete Vulnerability Scan check
    needs: [verify, decide, approve-exception]
    if: always() && needs.verify.outputs.check_id != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Complete the candidate check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ needs.verify.outputs.check_id }}
          DECISION: ${{ needs.decide.outputs.decision }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          APPROVAL_RESULT: ${{ needs['approve-exception'].result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary="Assessment failed closed. Review the trusted assessment run and its scanner reports."
          if [[ "$VERIFY_RESULT" == "success" && "$DECIDE_RESULT" == "success" && "$DECISION" == "pass" ]]; then
            conclusion=success
            summary="Both platform scans passed; candidate $SOURCE_SHA is eligible for downstream promotion."
          elif [[ "$VERIFY_RESULT" == "success" && "$DECIDE_RESULT" == "success" && "$DECISION" == "approval_required" && "$APPROVAL_RESULT" == "success" ]]; then
            conclusion=success
            summary="Candidate $SOURCE_SHA has an explicit, candidate-bound security-exception environment approval."
          elif [[ "$VERIFY_RESULT" == "success" && "$DECIDE_RESULT" == "success" && "$DECISION" == "blocked" ]]; then
            summary="Fixable vulnerabilities, invalid policy inputs, or scanner errors block candidate $SOURCE_SHA."
          fi
          jq -n --arg conclusion "$conclusion" --arg summary "$summary" \
            '{status:"completed",conclusion:$conclusion,completed_at:(now|todate),output:{title:"Trusted vulnerability assessment",summary:$summary}}' \
            > "$RUNNER_TEMP/check-update.json"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_ID" \
            --input "$RUNNER_TEMP/check-update.json"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::$summary" >&2
            exit 1
          fi
