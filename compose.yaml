volumes:
  conformance-suite-data:

services:
  conformance-suite:
    image: docker.io/openbanking/conformance-suite-v2:${CONFORMANCE_SUITE_VERSION:-latest}
    build: .
    ports:
      - "127.0.0.1:8443:8443"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - conformance-suite-data:/data
