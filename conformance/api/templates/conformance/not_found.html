<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <style>
        :root {
            color-scheme: light;
            --bg: #f7f8fa;
            --panel: #ffffff;
            --border: #ccd3dc;
            --text: #1b1f24;
            --muted: #667085;
            --accent: #0b6bcb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(760px, calc(100% - 32px));
            margin: 0 auto;
            padding: 56px 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.65rem;
            line-height: 1.2;
        }

        p {
            margin: 0 0 16px;
        }

        .muted {
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .button {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 8px 14px;
            background: var(--accent);
            color: #ffffff;
            font: inherit;
            font-weight: 650;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <section class="panel" aria-labelledby="not-found-heading">
        <h1 id="not-found-heading">Page not found</h1>
        <p class="muted">{{ unmatched_path }} does not match a conformance suite page.</p>
        <a class="button" href="{% url 'plan-builder' %}">Open plan builder</a>
    </section>
</main>
</body>
</html>
