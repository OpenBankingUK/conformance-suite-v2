<section class="panel" id="run-log"{% if run_is_active %} hx-get="{{ log_partial_url }}" hx-trigger="every 2s, run-finished from:body" hx-swap="outerHTML"{% endif %}>
    <h2>Log</h2>
    <div class="grid">
        <div class="metric"><strong>{{ log_event_count }}</strong><span>Events</span></div>
        <div class="metric"><strong><a href="{{ raw_log_url }}">JSON</a></strong><span>Masked log</span></div>
        <div class="metric"><strong>{{ run.status }}</strong><span>Run state</span></div>
    </div>
</section>
